name: RC13 source sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rc13-sync2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply RC13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/rc13.patch <<'PATCH'
          diff --git a/PUBLIC_VERSION.txt b/PUBLIC_VERSION.txt
          --- a/PUBLIC_VERSION.txt
          +++ b/PUBLIC_VERSION.txt
          @@ -1 +1 @@
          -1.3.1-rc12
          +1.3.1-rc13
          diff --git a/VERSION.txt b/VERSION.txt
          --- a/VERSION.txt
          +++ b/VERSION.txt
          @@ -1 +1 @@
          -1.3.1-rc12
          +1.3.1-rc13
          diff --git a/content_agent/__init__.py b/content_agent/__init__.py
          --- a/content_agent/__init__.py
          +++ b/content_agent/__init__.py
          @@ -1,3 +1,3 @@
           """UA FREE Content Tool."""
           
          -__version__ = "1.3.1-rc12"
          +__version__ = "1.3.1-rc13"
          diff --git a/content_agent/google_drive.py b/content_agent/google_drive.py
          --- a/content_agent/google_drive.py
          +++ b/content_agent/google_drive.py
          @@ -326,10 +326,12 @@ class GoogleDriveClient:
           
               def _token(self) -> str:
                   if not self._access_token:
          -            self._access_token = refresh_access_token(self.client_id, self.client_secret, self.refresh_token)
          +            self._access_token = refresh_access_token(
          +                self.client_id, self.client_secret, self.refresh_token, timeout=15
          +            )
                   return self._access_token
           
          -    def inspect_media(self, file_id: str) -> DriveMediaInfo:
          +    def inspect_media(self, file_id: str, *, probe_public: bool = True) -> DriveMediaInfo:
          @@ -357,10 +359,12 @@ class GoogleDriveClient:
          -        public_direct, public_type = probe_public_media(file_id)
          -        if public_direct and public_type and public_type != mime_type:
          -            mime_type = public_type
          -            kind = _kind_from_mime(mime_type)
          +        public_direct = False
          +        if probe_public:
          +            public_direct, public_type = probe_public_media(file_id)
          +            if public_direct and public_type and public_type != mime_type:
          +                mime_type = public_type
          +                kind = _kind_from_mime(mime_type)
          @@ -384,6 +388,11 @@ class GoogleDriveClient:
                   if info.public_direct:
                       return ""
          +        # Generic publication preflight intentionally skips the expensive public
          +        # URL probe. Threads performs it only when this target actually runs.
          +        public_now, _content_type = probe_public_media(info.file_id)
          +        if public_now:
          +            return ""
                   if not info.can_share:
          diff --git a/content_agent/ui/main_window.py b/content_agent/ui/main_window.py
          --- a/content_agent/ui/main_window.py
          +++ b/content_agent/ui/main_window.py
          @@ -530,6 +530,8 @@ class MainWindow:
                       self.status_var.set(display)
                       self.operation_detail_var.set(display)
          +            if hasattr(self, "queue_alert_var") and ("публікація" in text or "опубліковано" in text):
          +                self.queue_alert_var.set("")
                       if not self.operation_running:
          @@ -549,7 +551,16 @@ class MainWindow:
                       labels = target_labels(self.config)
          -            if result.failed_platforms:
          +            if result.cancelled:
          +                sent = ", ".join(labels.get(key, key) for key in result.sent_platforms)
          +                state = f"Пакет #{result.batch_id}: зупинено користувачем."
          +                if sent:
          +                    state += f" Уже опубліковано: {sent}."
          +                self.status_var.set(state)
          +                self.operation_detail_var.set(state)
          +                if hasattr(self, "queue_alert_var"):
          +                    self.queue_alert_var.set(state)
          +            elif result.failed_platforms:
          @@ -2704,7 +2715,7 @@ class MainWindow:
          -                if not self.worker.request_cancel(batch.id):
          +                if not self.worker.request_cancel(batch.id, reason="queue-ui-confirmed"):
          @@ -2841,6 +2852,8 @@ class MainWindow:
                   labels = target_labels(self.config)
                   lines = [f"Пакет #{value.batch_id} оброблено."]
          +        if value.cancelled:
          +            lines.append("Публікацію зупинено явною командою користувача; нові платформи не запускалися.")
                   if value.sent_platforms:
          diff --git a/content_agent/ui/queue_safety_v1_3_1_rc1.py b/content_agent/ui/queue_safety_v1_3_1_rc1.py
          --- a/content_agent/ui/queue_safety_v1_3_1_rc1.py
          +++ b/content_agent/ui/queue_safety_v1_3_1_rc1.py
          @@ -49,7 +49,7 @@ class QueueSafetyRC1Mixin:
          -                if not self.worker.request_cancel(batch.id):
          +                if not self.worker.request_cancel(batch.id, reason="queue-ui-confirmed"):
          diff --git a/content_agent/ui/v1_3_window.py b/content_agent/ui/v1_3_window.py
          --- a/content_agent/ui/v1_3_window.py
          +++ b/content_agent/ui/v1_3_window.py
          @@ -41,9 +41,9 @@ logger = logging.getLogger("content_agent.ui.rc8")
           class MainWindow(SourceHealthV13Mixin, StableV122Window):
          -    """UA FREE Content Tool v1.3.1-rc12 stabilization layer."""
          +    """UA FREE Content Tool v1.3.1-rc13 stabilization layer."""
           
          -    VERSION_LABEL = "1.3.1-rc12"
          +    VERSION_LABEL = "1.3.1-rc13"
          @@ -74,7 +74,7 @@ class MainWindow(SourceHealthV13Mixin, StableV122Window):
          -        self.root.title("UA FREE Content Tool — v1.3.1-rc12")
          +        self.root.title("UA FREE Content Tool — v1.3.1-rc13")
          diff --git a/content_agent/worker.py b/content_agent/worker.py
          --- a/content_agent/worker.py
          +++ b/content_agent/worker.py
          @@ -28,6 +28,7 @@ class WorkerResult:
               completed: bool = False
               busy: bool = False
               paused: bool = False
          +    cancelled: bool = False
               pause_reason: str = ""
          @@ -56,7 +57,7 @@ class PublicationWorker:
          -        media_preflight_timeout_seconds: float = 60.0,
          +        media_preflight_timeout_seconds: float = 100.0,
          @@ -79,12 +80,18 @@ class PublicationWorker:
                   self._cancel_requested_batches: set[int] = set()
                   self._active_batch_id: int | None = None
          +        self._media_preflight_lock = threading.Lock()
          +        self._media_preflight_jobs: dict[int, tuple[
          +            threading.Event,
          +            list[tuple[MediaPayload | None, GoogleDriveClient | None, int, DriveMediaInfo | None]],
          +            list[BaseException],
          +        ]] = {}
          @@ -87,7 +94,7 @@ class PublicationWorker:
          -    def request_cancel(self, batch_id: int) -> bool:
          +    def request_cancel(self, batch_id: int, *, reason: str = "explicit") -> bool:
          @@ -101,8 +108,15 @@ class PublicationWorker:
                   with self._cancel_lock:
                       if self._active_batch_id != batch_id:
          +                logger.info(
          +                    "Publication cancellation rejected batch=%s reason=%s active_batch=%s",
          +                    batch_id, reason, self._active_batch_id,
          +                )
                           return False
                       self._cancel_requested_batches.add(batch_id)
          +        logger.warning("Publication cancellation requested batch=%s reason=%s", batch_id, reason)
                   self.wake()
          @@ -200,7 +214,9 @@ class PublicationWorker:
          -        info = client.inspect_media(group.media_file_id)
          +        # Keep the generic media read bounded. Threads public-URL probing is
          +        # deferred until a Threads target actually needs it.
          +        info = client.inspect_media(group.media_file_id, probe_public=False)
          @@ -219,28 +235,42 @@ class PublicationWorker:
          -        """Run Drive preflight outside SQLite locks with a cancellable hard bound.
          -
          -        Drive reads have no publication side effects, so a timed-out/background
          -        read can safely be abandoned without risking a duplicate social post.
          -        """
          -        done = threading.Event()
          -        result_holder: list[tuple[MediaPayload | None, GoogleDriveClient | None, int, DriveMediaInfo | None]] = []
          -        error_holder: list[BaseException] = []
          -
          -        def runner() -> None:
          -            try:
          -                result_holder.append(self._load_media(batch_article_id))
          -            except BaseException as exc:
          -                error_holder.append(exc)
          -            finally:
          -                done.set()
          -
          -        threading.Thread(
          -            target=runner,
          -            name=f"drive-preflight-{batch_id}",
          -            daemon=True,
          -        ).start()
          +        """Run Drive preflight outside SQLite locks with one reusable in-flight job."""
          +        batch_key = int(batch_id)
          +        with self._media_preflight_lock:
          +            job = self._media_preflight_jobs.get(batch_key)
          +            if job is not None and job[0].is_set() and job[2]:
          +                self._media_preflight_jobs.pop(batch_key, None)
          +                job = None
          +            if job is None:
          +                done = threading.Event()
          +                result_holder: list[tuple[
          +                    MediaPayload | None, GoogleDriveClient | None, int, DriveMediaInfo | None
          +                ]] = []
          +                error_holder: list[BaseException] = []
          +                job = (done, result_holder, error_holder)
          +                self._media_preflight_jobs[batch_key] = job
          +                def runner() -> None:
          +                    try:
          +                        result_holder.append(self._load_media(batch_article_id))
          +                    except BaseException as exc:
          +                        error_holder.append(exc)
          +                    finally:
          +                        done.set()
          +                threading.Thread(target=runner, name=f"drive-preflight-{batch_id}", daemon=True).start()
          +
          +        done, result_holder, error_holder = job
          @@ -248,13 +278,17 @@ class PublicationWorker:
          -                    f"Google Drive не завершив підготовку медіа за {int(self.media_preflight_timeout_seconds)} секунд."
          +                    f"Google Drive не завершив підготовку медіа за {int(self.media_preflight_timeout_seconds)} секунд. "
          +                    "Поточне безпечне читання не дублюється; наступна спроба використає його результат."
          @@ -258,6 +292,9 @@ class PublicationWorker:
                   self._raise_if_cancel_requested(batch_id)
          +        with self._media_preflight_lock:
          +            if self._media_preflight_jobs.get(batch_key) is job:
          +                self._media_preflight_jobs.pop(batch_key, None)
                   if error_holder:
          @@ -493,6 +527,7 @@ class PublicationWorker:
                       except PublicationCancelRequested:
                           self.database.cancel_claimed_batch(batch.id, owner)
          +                result.cancelled = True
          @@ -551,6 +586,7 @@ class PublicationWorker:
                       if self._cancel_requested(batch.id):
                           self.database.cancel_claimed_batch(batch.id, owner)
          +                result.cancelled = True
          @@ -612,6 +648,7 @@ class PublicationWorker:
                           if self._cancel_requested(batch.id):
                               self.database.cancel_claimed_batch(batch.id, owner)
          +                    result.cancelled = True
          @@ -690,6 +727,7 @@ class PublicationWorker:
               except PublicationCancelRequested:
                   try:
                       self.database.cancel_claimed_batch(batch.id, owner)
          +            result.cancelled = True
                   except LeaseLost:
          diff --git a/tests/test_r8_fix8.py b/tests/test_r8_fix8.py
          --- a/tests/test_r8_fix8.py
          +++ b/tests/test_r8_fix8.py
          @@ -89,7 +89,8 @@ def test_drive_creates_and_revokes_temporary_threads_permission(monkeypatch) -> None:
          -    monkeypatch.setattr("content_agent.google_drive.probe_public_media", lambda _file_id: (True, "image/jpeg"))
          +    probes = iter([(False, ""), (True, "image/jpeg")])
          +    monkeypatch.setattr("content_agent.google_drive.probe_public_media", lambda _file_id: next(probes))
          PATCH
          git apply --ignore-space-change --ignore-whitespace /tmp/rc13.patch

          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v1.3.1-rc12', 'v1.3.1-rc13').replace('RELEASE_NOTES_v1.3.1-rc12.md', 'RELEASE_NOTES_v1.3.1-rc13.md')
          p.write_text(s, encoding='utf-8')
          PY

          cat > RELEASE_NOTES_v1.3.1-rc13.md <<'EOF'
          # UA FREE Content Tool v1.3.1-rc13

          Focused publication-queue stabilization on the canonical RC12 source.

          ## Fixed
          - Drive publication preflight no longer runs the expensive Threads public-URL probe for every generic media read.
          - Publication-side Google OAuth refresh is bounded to 15 seconds.
          - Drive media preflight hard limit is 100 seconds and now exceeds the bounded token + metadata + download path instead of contradicting its inner timeouts.
          - One batch can have only one Drive preflight in flight. A late read is reused by the next controlled retry instead of spawning overlapping daemon requests.
          - Threads public accessibility is checked only when Threads actually needs the URL, before a temporary permission is created.
          - Explicit queue cancellation is audited with a reason and has its own WorkerResult state.
          - Stale orange preflight warnings are cleared when a controlled retry starts making publication progress.

          ## Compatibility
          - No SQLite schema change.
          - Copy the complete existing `Data` directory into a fresh RC13 portable folder.
          - Already-sent targets remain protected from duplicate publication.
          EOF

          cat > tests/test_rc13_publication_stability.py <<'EOF'
          from __future__ import annotations
          import time
          import pytest
          from content_agent.google_drive import DriveMediaInfo, GoogleDriveClient, GoogleDriveError
          from content_agent.network import HttpResponse
          from content_agent.worker import PublicationWorker, WorkerResult

          class _LeaseDb:
              def assert_lease(self, _batch_id: int, _owner: str) -> None: return
              def renew_lease(self, _batch_id: int, _owner: str, _seconds: int) -> None: return

          def test_generic_publication_drive_inspection_skips_threads_public_probe(monkeypatch) -> None:
              metadata = (b'{"id":"1AbCdEfGhIjKlMnOpQrStUvWxYz_12345","name":"photo.jpg",' b'"mimeType":"image/jpeg","size":"123","trashed":false,' b'"capabilities":{"canDownload":true,"canDelete":true,"canShare":true}}')
              monkeypatch.setattr("content_agent.google_drive.fetch_url", lambda url, **_kwargs: HttpResponse(200, {"content-type": "application/json"}, metadata, url))
              monkeypatch.setattr("content_agent.google_drive.probe_public_media", lambda _file_id: (_ for _ in ()).throw(AssertionError("unexpected Threads public probe")))
              client = GoogleDriveClient("client.apps.googleusercontent.com", "secret", "refresh"); client._access_token = "access"
              assert client.inspect_media("1AbCdEfGhIjKlMnOpQrStUvWxYz_12345", probe_public=False).public_direct is False

          def test_threads_reuses_existing_public_access_without_creating_permission(monkeypatch) -> None:
              monkeypatch.setattr("content_agent.google_drive.probe_public_media", lambda _file_id: (True, "image/jpeg"))
              monkeypatch.setattr("content_agent.google_drive.fetch_url", lambda _url, **_kwargs: (_ for _ in ()).throw(AssertionError("permission POST must not run")))
              client = GoogleDriveClient("client.apps.googleusercontent.com", "secret", "refresh"); client._access_token = "access"
              info = DriveMediaInfo(file_id="1AbCdEfGhIjKlMnOpQrStUvWxYz_12345", name="photo.jpg", mime_type="image/jpeg", size=123, kind="image", can_download=True, can_delete=True, can_share=True, public_url="https://drive.google.com/uc?export=download&id=x", public_direct=False)
              assert client.ensure_public_for_threads(info) == ""

          def test_drive_preflight_reuses_late_inflight_job(monkeypatch) -> None:
              worker = PublicationWorker(_LeaseDb(), object(), media_preflight_timeout_seconds=1.0)
              worker.media_preflight_timeout_seconds = 0.05
              calls = []; expected = (None, None, 77, None)
              def slow_load(_article_id: int): calls.append(1); time.sleep(0.28); return expected
              monkeypatch.setattr(worker, "_load_media", slow_load)
              with pytest.raises(GoogleDriveError, match="не дублюється"): worker._load_media_cancellable(batch_id=273, batch_article_id=1, owner="owner")
              assert worker._load_media_cancellable(batch_id=273, batch_article_id=1, owner="owner") == expected
              assert len(calls) == 1

          def test_worker_result_distinguishes_explicit_cancellation() -> None:
              assert WorkerResult(claimed=True, batch_id=273, cancelled=True).cancelled is True
          EOF

          rm -f .github/workflows/rc13-sync.yml .github/workflows/rc13-sync2.yml
          python -m compileall -q content_agent tests app.py
          python -m pytest -q tests/test_rc13_publication_stability.py tests/test_r8_fix8.py tests/test_rc12_stability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v1.3.1-rc13 publication stabilization'
          git push origin HEAD:main
          gh workflow run release.yml --ref main
