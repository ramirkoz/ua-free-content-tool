name: RC55 final consolidation security gate

on:
  push:
    branches: [rc55-final-consolidation-security]
  pull_request:
    branches: [main]
    paths:
      - content_agent/**
      - tests/**
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - RELEASE_NOTES_v2.0.0-rc55.md
      - .github/workflows/rc55-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application and tests
        shell: pwsh
        run: python -m compileall -q content_agent tests
      - name: RC55 final acceptance contracts
        shell: pwsh
        run: python -m pytest -q tests/test_rc55_final_acceptance.py
      - name: Keep RC54 operator UI retention platform green
        shell: pwsh
        run: python -m pytest -q tests/test_rc54_operator_ui_retention.py
      - name: Keep RC53 Inbox controller green
        shell: pwsh
        run: python -m pytest -q tests/test_rc53_inbox_controller.py
      - name: Keep RC52 publication architecture green
        shell: pwsh
        run: python -m pytest -q tests/test_rc52_publication_architecture.py tests/test_rc52_active_factory.py
      - name: Keep RC51 AI architecture green
        shell: pwsh
        run: python -m pytest -q tests/test_rc51_ai_architecture.py
      - name: Keep RC50 storage green
        shell: pwsh
        run: python -m pytest -q tests/test_rc50_storage_contract.py
      - name: Keep RC49 startup green
        shell: pwsh
        run: python -m pytest -q tests/test_rc49_startup_contract.py tests/test_rc49_runtime_smoke.py
      - name: Keep RC48 through RC41 retained gates green
        shell: pwsh
        run: |
          python -m pytest -q tests/test_rc48_ux_reliability.py
          python -m pytest -q tests/test_rc47_composition_contracts.py
          python -m pytest -q tests/test_rc46_clean_import_wrapper.py
          python -m pytest -q tests/test_rc45_reliability.py
          python -m pytest -q tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
          python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
          python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: RC55 architecture and operator invariants
        shell: pwsh
        run: |
          $badLayer = Get-ChildItem content_agent -Recurse -File -Filter *.py | Where-Object {
            $_.Name -match 'window_rc55' -or $_.Name -match 'rc55_window'
          }
          if ($badLayer) { throw "RC55 must not add a version-numbered runtime window layer" }
          if (Test-Path content_agent/v2/ai/direct_router_runtime.py) { throw "direct_router_runtime resurrected" }
          $inbox = Get-Content content_agent/v2/ui/tabs/inbox.py -Raw
          if ($inbox -notmatch 'DISPLAY_COLUMNS = \("title", "topic", "sources", "published"\)') { throw "Inbox four-column contract changed" }
          if ($inbox -match 'limit=200') { throw "Inbox hidden 200-row cap returned" }
          $shell = Get-Content content_agent/v2/ui/manual_topics_window_rc44.py -Raw
          if ($shell -notmatch '_apply_rc55_inbox_cleanup') { throw "RC55 Inbox cleanup is not active" }
          if ($shell -notmatch 'Пошук у Вхідних:' -or $shell -notmatch 'Колонки') { throw "RC55 cleanup guard missing legacy control names" }
          $legacy = Get-Content content_agent/v2/ui/legacy_manual_topics_window_rc44.py -Raw
          if ($legacy -match '"Відновити стандартні колонки": "Колонки"') { throw "legacy column reset mapping returned" }
          if ($legacy -notmatch '"Редагувати склад блоку": "Склад блоку\.\.\."') { throw "manual block composition editor was removed" }
          $container = Get-Content content_agent/app/container.py -Raw
          if ($container -notmatch 'collection: CollectionService' -or $container -notmatch 'publishing: PublicationService') { throw "AppServices composition incomplete" }
          $updater = Get-Content content_agent/v2/supervisor/updater.py -Raw
          if ($updater -notmatch 'verify_manifest' -or $updater -notmatch 'UPDATE_SIGNED_MANIFEST_MISSING') { throw "signed updater manifest not enforced" }
      - name: Full repository suite BLOCKING
        shell: pwsh
        run: python -m pytest -q
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package exact portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc55') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC55.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc55_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc55_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC55.txt
          if-no-files-found: error
