name: RC55 final consolidation gate

on:
  push:
    branches: [rc55-final-consolidation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application
        shell: pwsh
        run: python -m compileall -q content_agent tests
      - name: RC55 final UI contract
        shell: pwsh
        run: python -m pytest -q tests/test_rc55_final_contract.py
      - name: Fact Guard safety gate
        shell: pwsh
        run: python -m pytest -q tests/test_fact_guard_rc34.py tests/test_fact_guard_rc35.py tests/test_fact_guard_rc36.py tests/test_fact_guard_rc38.py tests/test_v1_3_evidence_budget.py tests/test_v1_3_evidence_fact_pipeline.py tests/test_v1_4_rc16_fact_guard.py tests/test_v1_4_rc17_fact_guard.py
      - name: Retained RC41-RC54 release gates
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_rc54_operator_ui_retention.py
          tests/test_rc53_inbox_controller.py
          tests/test_rc52_publication_architecture.py tests/test_rc52_active_factory.py
          tests/test_rc51_ai_architecture.py
          tests/test_rc50_storage_contract.py
          tests/test_rc49_startup_contract.py tests/test_rc49_runtime_smoke.py
          tests/test_rc48_ux_reliability.py
          tests/test_rc47_composition_contracts.py
          tests/test_rc46_clean_import_wrapper.py
          tests/test_rc45_reliability.py
          tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
          tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
          tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: RC55 architecture invariants
        shell: pwsh
        run: |
          $badLayer = Get-ChildItem content_agent -Recurse -File -Filter *.py | Where-Object {
            $_.Name -match 'window_rc55' -or $_.Name -match 'rc55_window'
          }
          if ($badLayer) { throw "RC55 must not add a version-numbered runtime UI layer" }
          $shell = Get-Content content_agent/v2/ui/manual_topics_window_rc44.py -Raw
          if ($shell -notmatch 'INBOX_DISPLAY_COLUMNS = \("title", "topic", "sources", "published"\)') { throw "RC55 Inbox contract missing" }
          if ($shell -notmatch 'def reset_inbox_columns') { throw "legacy column reset is not fail-safe" }
          if (Test-Path content_agent/v2/ai/direct_router_runtime.py) { throw "direct_router_runtime monkeypatch layer returned" }
      - name: Repository-wide final suite
        shell: pwsh
        run: python -m pytest -q
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc55') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC55.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc55_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc55_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC55.txt
          if-no-files-found: error
