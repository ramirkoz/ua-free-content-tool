name: One-time sync Content Tool rc7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-content-rc7.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize target files and apply exact rc7 delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = ['README.md', 'content_agent/ai_router_v1_2_1.py', 'content_agent/ai_router_v1_2_2.py', 'content_agent/codex_engine_v1_3.py', 'content_agent/database.py', 'content_agent/global_duplicates_v1_2_2_rc7.py', 'content_agent/rewrite_pipeline_v1_3.py', 'content_agent/ui/ai_engine_v1_3.py', 'content_agent/ui/ai_workflow_v1_3_rc6.py', 'content_agent/ui/main_window.py', 'content_agent/ui/v1_2_combined_window.py', 'content_agent/ui/v1_2_rc10_window.py', 'content_agent/ui/v1_2_rc2_window.py', 'content_agent/ui/v1_2_rc3_window.py', 'content_agent/ui/v1_2_rc8_window.py']
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          printf '%s' '[... ELLIPSIZATION ...]' | base64 -d | xz -d > /tmp/rc7.patch
          git apply --check /tmp/rc7.patch
          git apply /tmp/rc7.patch
          rm -f /tmp/rc7.patch

      - name: Verify rc7 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < VERSION.txt)" = "1.3.1-rc7"
          test "$(tr -d '\r\n ' < PUBLIC_VERSION.txt)" = "1.3.1-rc7"
          test -f RELEASE_NOTES_v1.3.1-rc7.md
          python -m compileall -q content_agent
          python - <<'PY'
          from content_agent import __version__
          assert __version__ == '1.3.1-rc7', __version__
          print('RC7_SOURCE_SYNC_OK')
          PY

      - name: Commit rc7 source and remove one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_NOTES_v1.3.1-rc7.md content_agent
          git rm .github/workflows/sync-content-rc7.yml
          git commit -m "Sync UA FREE Content Tool v1.3.1-rc7 source"
          git push origin HEAD:main
          gh workflow run release.yml --ref main -f version=1.3.1-rc7 -f prerelease=true
