name: KONTUR RC45 Temporary Public Transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kontur-rc45-public-transfer.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify RC45
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://tempfile.org/HhNYADyCcjf/download -o rc45.zip
          echo 'b80eb6d43ee0881e0ecf4ed245a067b03f648359db3cf882b9f7f1cf1a1316b8  rc45.zip' | sha256sum -c -
          mkdir payload
          unzip -q rc45.zip -d payload
          test -f payload/KONTUR_RF.exe
          test -f payload/KONTUR_UpdateWatch_RC26.exe
          test -f payload/KONTUR_TransactionRunner_RC26.exe
      - name: Upload updater-ready artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR_RC45_DRIVE_BRIDGE
          path: payload/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Print artifact digest
        shell: bash
        run: echo "RC45_ARTIFACT_SHA256=${{ steps.upload.outputs.artifact-digest }}"
