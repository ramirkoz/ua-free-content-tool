name: Apply RC11 stabilization sync once

on:
  push:
    branches:
      - sync/v1.3.1-rc11
    paths:
      - '.github/workflows/rc11-sync-once.yml'
      - 'tools/apply_rc11_sync.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/v1.3.1-rc11

      - name: Apply deterministic RC11 patch
        run: |
          python tools/apply_rc11_sync.py
          python -m compileall -q content_agent
          grep -q '1.3.1-rc11' VERSION.txt
          grep -q 'provider_caps = {"codex": 42' content_agent/ai_router_v1_2_2.py
          grep -q '_rewrite_inflight' content_agent/ui/v1_3_window.py
          grep -q 'ui_freeze_trace.log' content_agent/ui/main_window.py

      - name: Commit synchronized source and remove one-time patcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_rc11_sync.py .github/workflows/rc11-sync-once.yml
          git add -A
          git commit -m 'Apply RC11 rewrite and UI stability synchronization'
          git push origin HEAD:sync/v1.3.1-rc11
