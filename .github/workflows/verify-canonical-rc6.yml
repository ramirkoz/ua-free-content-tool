name: Verify canonical RC6 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-canonical-rc6.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every canonical RC6 source file
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -dc > /tmp/expected.txt
          failures=0; total=0
          while read -r expected path; do
            total=$((total+1))
            if [ ! -f "$path" ]; then echo "MISSING $path"; failures=$((failures+1)); continue; fi
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then echo "MISMATCH $path expected=$expected actual=$actual"; failures=$((failures+1)); fi
          done < /tmp/expected.txt
          echo "TOTAL=$total FAILURES=$failures"
          test "$total" -eq 229
          test "$failures" -eq 0
      - name: Remove verifier after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UA FREE sync'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/verify-canonical-rc6.yml
          git commit -m 'Remove completed RC6 verification workflow'
          git push origin HEAD:main
