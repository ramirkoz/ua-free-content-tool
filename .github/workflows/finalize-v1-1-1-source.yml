name: Finalize v1.1.1 source state

on:
  push:
    branches: [feature/v1.1.1-rewrite-history]
    paths:
      - .github/workflows/finalize-v1-1-1-source.yml

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.1.1-rewrite-history
          fetch-depth: 0

      - name: Remove temporary workflow and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-v1-1-1-source.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path.cwd()
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'FILE_MANIFEST.sha256':
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")
          (root / 'FILE_MANIFEST.sha256').write_text(
              '\n'.join(lines) + '\n', encoding='ascii', newline='\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FILE_MANIFEST.sha256
          git commit -m "Finalize v1.1.1 source manifest [skip ci]"
          git push origin HEAD:feature/v1.1.1-rewrite-history
