name: RC55 full-suite probe

on:
  push:
    branches: [rc55-final-consolidation-security]
    paths:
      - content_agent/**
      - tests/**
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - .github/workflows/rc55-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q content_agent
      - name: Full repository suite
        run: python -m pytest -q
