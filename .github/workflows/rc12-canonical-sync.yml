name: RC12 canonical sync apply

on:
  push:
    branches: [sync/rc12-full-canonical]
    paths:
      - .sync/rc12_delta.zip
      - .github/workflows/rc12-canonical-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact RC12 delta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $size = (Get-Item ".sync/rc12_delta.zip").Length
          if ($size -ne 24906) { throw "Unexpected delta size: $size" }
          $hash = (Get-FileHash ".sync/rc12_delta.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "068ecfdf83ade2b2ca30a761dc468746d959b37baf46e0a7aec7663ed27bc32f") {
            throw "Delta SHA mismatch: $hash"
          }
          Expand-Archive ".sync/rc12_delta.zip" -DestinationPath ".rc12_apply" -Force
          if ((Get-Content ".rc12_apply/VERSION.txt" -Raw).Trim() -ne "2.0.0-rc12") { throw "Bad RC12 VERSION" }

      - name: Apply RC12 delta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem ".rc12_apply" -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path ".rc12_apply").Path.Length + 1)
            $dest = Join-Path (Resolve-Path ".").Path $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item $_.FullName $dest -Force
          }
          Remove-Item ".rc12_apply" -Recurse -Force
          Remove-Item ".sync" -Recurse -Force
          Remove-Item ".github/workflows/rc12-canonical-sync.yml" -Force

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }

      - name: Compile
        run: python -m compileall -q .

      - name: Full regression suite
        run: python -m pytest -q

      - name: Entrypoint imports
        run: python tools/check_entrypoint_imports.py

      - name: Import application
        run: python -c "import content_agent.main"

      - name: RC11 preservation and RC12 diagnostics gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python - <<'PY'
          from pathlib import Path
          must = {
              "content_agent/v2/supervisor/control.py": [
                  "raise", "RemoteControlManager", "poll"
              ],
              "content_agent/v2/supervisor/resilient_runtime.py": [
                  "CONTROL_POLL_INTERVAL", "_last_control_poll", "_drive_auth_required",
                  "HANDLE_GROWTH_LIMIT"
              ],
              "content_agent/v2/supervisor/diagnostics.py": [
                  "auto_collect_scheduled", "auto_collect_enabled",
                  "failed_targets_15m", "failed_targets_60m",
                  "PUBLISH_FAILURES_ACTIVE", "DRIVE_REAUTH_REQUIRED",
                  "PROCESS_HANDLE_SOFT_LIMIT = 16000"
              ],
              "content_agent/v2/ui/window_rc11.py": [
                  "_rc11_schedule_autocollect_watchdog"
              ],
          }
          for name, needles in must.items():
              text = Path(name).read_text(encoding="utf-8")
              for needle in needles:
                  assert needle in text, f"{name}: missing {needle}"
          assert Path("VERSION.txt").read_text(encoding="utf-8").strip() == "2.0.0-rc12"
          assert Path("PUBLIC_VERSION.txt").read_text(encoding="utf-8").strip() == "2.0.0-rc12"
          print("RC12_CANONICAL_GATES_OK")
          PY

      - name: Commit clean canonical RC12
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "RC12: canonicalize real RC11 runtime with corrected diagnostics"
          git push origin HEAD:sync/rc12-full-canonical
