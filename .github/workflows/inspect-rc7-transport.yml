name: Inspect RC7 transport

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'trigger/rc7-finalize-execute'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v1.3.1-rc7-final
      - name: Inspect transport schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, lzma
          from pathlib import Path
          p=Path('.sync/rc7-remaining-102.json.xz.b64')
          data=json.loads(lzma.decompress(base64.b64decode(p.read_text(encoding='ascii'))).decode('utf-8'))
          print('TYPE', type(data).__name__)
          if isinstance(data, dict):
              print('KEYS', sorted(data))
              for k,v in data.items():
                  try: n=len(v)
                  except Exception: n='NA'
                  print('FIELD', k, type(v).__name__, n)
                  if isinstance(v, dict): print('SUBKEYS', k, list(v)[:12])
                  elif isinstance(v, list): print('SAMPLE', k, v[:3])
          PY
