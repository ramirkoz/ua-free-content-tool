name: Withdraw v1.1.2 Windows build

on:
  push:
    branches: [main]
    paths: [.github/workflows/withdraw-v1-1-2.yml]

permissions:
  contents: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark release as draft and remove Windows binary assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Hide the release immediately. Keep the tag and source history for auditability.
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/365420397 \
            -f draft=true \
            -f name='UA FREE Content Tool v1.1.2 — WITHDRAWN PENDING SECURITY REVIEW' \
            -f body='The Windows build was withdrawn after Microsoft Defender detected Trojan:Win32/Wacatac.C!ml. Do not restore, allow, or run the executable. A clean rebuild and Microsoft analysis are in progress.'
          # Remove public binary and its stale checksum asset from the withdrawn draft.
          gh api --method DELETE repos/${GITHUB_REPOSITORY}/releases/assets/502444466 || true
          gh api --method DELETE repos/${GITHUB_REPOSITORY}/releases/assets/502444467 || true
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/withdraw-v1-1-2.yml
          git commit -m 'Remove one-time v1.1.2 withdrawal workflow [skip ci]'
          git push origin HEAD:main
