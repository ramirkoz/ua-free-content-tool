name: Finalize RC3 sync

on:
  push:
    branches:
      - hotfix/v2.0.0-rc3-media-drive
    paths:
      - .github/workflows/finalize-rc3-sync.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v2.0.0-rc3-media-drive
      - name: Finalize RC3 metadata
        shell: python
        run: |
          from pathlib import Path
          p = Path('content_agent/v2/ui/window.py')
          text = p.read_text(encoding='utf-8').replace('2.0.0-rc2', '2.0.0-rc3')
          p.write_text(text, encoding='utf-8')
          for name in ('VERSION.txt', 'PUBLIC_VERSION.txt'):
              Path(name).write_text('2.0.0-rc3\n', encoding='utf-8')
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8').replace('v2.0.0-rc2', 'v2.0.0-rc3').replace('2.0.0-rc2', '2.0.0-rc3')
          readme.write_text(text, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_agent/v2/ui/window.py VERSION.txt PUBLIC_VERSION.txt README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RC3: finalize version metadata"
          git push origin HEAD:hotfix/v2.0.0-rc3-media-drive
