name: RC54 operator UI retention platform gate

on:
  push:
    branches: [rc54-ui-retention-platforms]
  pull_request:
    branches: [main]
    paths:
      - content_agent/**
      - tests/test_rc54_operator_ui_retention.py
      - tests/test_rc53_inbox_controller.py
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - RELEASE_NOTES_v2.0.0-rc54.md
      - .github/workflows/rc54-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application
        shell: pwsh
        run: python -m compileall -q content_agent tests
      - name: RC54 operator UI retention platform regressions
        shell: pwsh
        run: python -m pytest -q tests/test_rc54_operator_ui_retention.py
      - name: Keep RC53 Inbox controller green
        shell: pwsh
        run: python -m pytest -q tests/test_rc53_inbox_controller.py
      - name: Keep RC52 publication platform architecture green
        shell: pwsh
        run: python -m pytest -q tests/test_rc52_publication_architecture.py tests/test_rc52_active_factory.py
      - name: Keep RC51 AI architecture green
        shell: pwsh
        run: python -m pytest -q tests/test_rc51_ai_architecture.py
      - name: Keep RC50 storage backup composition green
        shell: pwsh
        run: python -m pytest -q tests/test_rc50_storage_contract.py
      - name: Keep RC49 startup regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc49_startup_contract.py tests/test_rc49_runtime_smoke.py
      - name: Keep RC48 UX reliability green
        shell: pwsh
        run: python -m pytest -q tests/test_rc48_ux_reliability.py
      - name: Keep RC47 composition green
        shell: pwsh
        run: python -m pytest -q tests/test_rc47_composition_contracts.py
      - name: Keep RC46 clean import green
        shell: pwsh
        run: python -m pytest -q tests/test_rc46_clean_import_wrapper.py
      - name: Keep RC45 reliability green
        shell: pwsh
        run: python -m pytest -q tests/test_rc45_reliability.py
      - name: Keep RC44 and RC43 topics green
        shell: pwsh
        run: python -m pytest -q tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
      - name: Keep RC42 Instagram regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
      - name: Keep RC41 Drive auth green
        shell: pwsh
        run: python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: RC54 architecture invariants
        shell: pwsh
        run: |
          $badLayer = Get-ChildItem content_agent -Recurse -File -Filter *.py | Where-Object {
            $_.Name -match '(^|_)rc54(_|\.|$)' -or $_.Name -match 'window_rc54' -or $_.Name -match 'rc54_window'
          }
          if ($badLayer) { throw "RC54 must not add a version-numbered runtime layer: $($badLayer.FullName -join ', ')" }
          $inbox = Get-Content content_agent/v2/ui/tabs/inbox.py -Raw
          if ($inbox -match '"score"' -or $inbox -match '"source"') { throw "Inbox display resurrected source-name/score columns" }
          if ($inbox -match 'limit=200') { throw "Inbox hidden 200-row cap returned" }
          $shell = Get-Content content_agent/v2/ui/manual_topics_window_rc44.py -Raw
          if ($shell -notmatch 'PlatformsTabController' -or $shell -notmatch 'DataBackupsTabController') { throw "RC54 tabs are not composed into active shell" }
      - name: Repository-wide baseline audit
        id: repo_audit
        continue-on-error: true
        shell: pwsh
        run: python -m pytest -q
      - name: Record repository-wide baseline debt
        if: steps.repo_audit.outcome == 'failure'
        shell: pwsh
        run: Write-Warning "Repository-wide audit still contains historical failures outside the scoped RC54 gate. Do not call full suite green."
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc54') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC54.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc54_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc54_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC54.txt
          if-no-files-found: error
