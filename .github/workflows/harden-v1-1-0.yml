name: Harden v1.1.0 implementation

on:
  push:
    branches:
      - feature/v1.1.0-bilingual-learning-inbox
    paths:
      - tools/apply_v1_1_0_hardening.py
      - .github/workflows/harden-v1-1-0.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_v1_1_0_hardening.py
      - .github/workflows/harden-v1-1-0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.1.0-bilingual-learning-inbox
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt

      - name: Apply hardening changes
        run: python tools/apply_v1_1_0_hardening.py

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Verify entrypoint imports
        run: python tools/check_entrypoint_imports.py

      - name: Import application
        run: python -c "import content_agent.main"

      - name: Commit validated hardening
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/harden-v1-1-0.yml
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No hardening changes to commit."
            exit 0
          }
          git commit -m "Harden v1.1.0 learning data and migration [skip ci]"
          git push origin HEAD:feature/v1.1.0-bilingual-learning-inbox
