name: RC58 Telegram video carousel gate

on:
  push:
    branches: [rc58-telegram-video-carousel]
  pull_request:
    branches: [main]
    paths:
      - content_agent/**
      - tests/**
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - RELEASE_NOTES_v2.0.0-rc58.md
      - .github/workflows/rc58-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application and tests
        shell: pwsh
        run: python -m compileall -q content_agent tests
      - name: RC58 media carousel contracts
        shell: pwsh
        run: python -m pytest -q tests/test_rc58_video_carousel.py
      - name: Keep RC57 and RC56 live fixes green
        shell: pwsh
        run: |
          python -m pytest -q tests/test_rc57_inbox_stability.py
          python -m pytest -q tests/test_rc56_live_bugfixes.py
      - name: Full repository suite BLOCKING
        shell: pwsh
        run: python -m pytest -q
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package exact portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc58') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC58.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc58_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc58_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC58.txt
          if-no-files-found: error
