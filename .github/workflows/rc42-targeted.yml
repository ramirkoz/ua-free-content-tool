name: RC42 focused Instagram multi-account gate

on:
  push:
    branches: [rc42-instagram-multi-ui]
  pull_request:
    branches: [main]
    paths:
      - content_agent/ui/v1_4_rc30_window.py
      - content_agent/destinations_v1_4.py
      - content_agent/instagram_accounts_v1_4.py
      - tests/test_rc42_instagram_multi_ui.py
      - tests/test_v1_4_destinations.py
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - content_agent/__init__.py
      - RELEASE_NOTES_v2.0.0-rc42.md
      - .github/workflows/rc42-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application
        shell: pwsh
        run: python -m compileall -q content_agent
      - name: Instagram multi-account regressions
        shell: pwsh
        run: python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
      - name: Keep RC41 Drive auth regression green
        shell: pwsh
        run: python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC42.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc42_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc42_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC42.txt
          if-no-files-found: error
