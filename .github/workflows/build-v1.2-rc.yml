name: Build Windows RC7 v1.2.0-dev

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.2.0-editorial-memory-media

permissions:
  contents: read

jobs:
  windows-rc7:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact RC7 commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate RC7 source and regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          python tools/check_entrypoint_imports.py
          if ($LASTEXITCODE -ne 0) { throw "Entrypoint validation failed" }
          python -c "import PIL, content_agent.main; from content_agent.ui.v1_2_rc6_window import MainWindow; from content_agent.telegram_media_v1_3_rc6 import telegram_embed_url; from content_agent.global_duplicates_v1_3_rc6 import parse_duplicate_clusters; from content_agent.codex_engine_v1_3 import inspect_codex; from content_agent.facebook_comments_v1_2_rc3 import CommentedFacebookPublisher; s=inspect_codex(); assert not s.installed; assert telegram_embed_url('https://t.me/example/123').endswith('?embed=1&mode=tme'); print('RC7_SOURCE_GATE_OK', PIL.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "RC7 imports failed" }

      - name: Stamp isolated RC7 version
        shell: pwsh
        run: |
          "1.2.0-dev" | Set-Content PUBLIC_VERSION.txt -Encoding ascii
          "1.2.0-dev" | Set-Content VERSION.txt -Encoding ascii

      - name: Build signed portable runtime
        shell: cmd
        run: Build_Portable_Windows.bat

      - name: Validate signed RC7 runtime and GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v1.2.0-dev\UA_FREE_Content_Tool").Path
          $exe = (Resolve-Path (Join-Path $root "UA_FREE_Content_Tool.exe")).Path
          $console = (Resolve-Path (Join-Path $root "_runtime_console.exe")).Path
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne "Valid") { throw "Invalid launcher signature: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch "Python Software Foundation") { throw "Unexpected launcher signer: $($signature.SignerCertificate.Subject)" }
          Push-Location $root
          try {
            & $console -I -c "import PIL, content_agent.main; from content_agent.ui.v1_2_rc6_window import MainWindow; from content_agent.telegram_media_v1_3_rc6 import extract_telegram_post_media; from content_agent.global_duplicates_v1_3_rc6 import parse_duplicate_clusters; from content_agent.codex_engine_v1_3 import inspect_codex; from content_agent.facebook_comments_v1_2_rc3 import CommentedFacebookPublisher; s=inspect_codex(); assert not s.installed; import tkinter as tk; r=tk.Tk(); r.withdraw(); r.update_idletasks(); r.destroy(); print('SIGNED_RC7_RUNTIME_OK')"
            if ($LASTEXITCODE -ne 0) { throw "RC7 runtime import failed" }
          } finally { Pop-Location }
          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "Portable GUI exited during startup smoke test: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          if (-not (Test-Path (Join-Path $root "Data\content_agent.sqlite3"))) { throw "Startup did not create local database" }
          Remove-Item $console -Force
          Remove-Item (Join-Path $root "_runtime_console._pth") -Force
          Remove-Item (Join-Path $root "Data\*") -Recurse -Force -ErrorAction SilentlyContinue

      - name: Defender scan extracted RC7 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v1.2.0-dev\UA_FREE_Content_Tool").Path
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) { throw "Defender scanner unavailable" }
          & $scanner.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender update failed" }
          & $scanner.FullName -Scan -ScanType 3 -File $root -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender runtime scan failed" }

      - name: Package and validate RC7
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "Release\UA_FREE_Content_Tool_v1.2.0-dev\UA_FREE_Content_Tool"
          $zip = "UA_FREE_Content_Tool_v1.2.0-dev_Windows_Portable_RC7.zip"
          $hashFile = "UA_FREE_Content_Tool_v1.2.0-dev_RC7_SHA256.txt"
          Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal
          @'
          import sys, zipfile
          archive = sys.argv[1]
          required = {
              "content_agent/ui/v1_2_rc6_window.py",
              "content_agent/ui/ai_workflow_v1_3_rc6.py",
              "content_agent/ui/social_connections_v1_3_rc6.py",
              "content_agent/ui/global_duplicates_dialog_v1_3_rc6.py",
              "content_agent/telegram_media_v1_3_rc6.py",
              "content_agent/global_duplicates_v1_3_rc6.py",
              "content_agent/codex_engine_v1_3.py",
              "content_agent/rowboat_bridge_v1_3.py",
              "content_agent/facebook_comments_v1_2_rc3.py",
              "content_agent/comment_compat_v1_2_rc3.py",
              "content_agent/ui/v1_2_rc5_window.py",
              "content_agent/ui/v1_2_rc4_window.py",
              "content_agent/worker_v1_2_rc4.py",
          }
          allowed_executables = {
              "UA_FREE_Content_Tool.exe",
              "Lib/site-packages/pip/_vendor/distlib/t32.exe",
              "Lib/site-packages/pip/_vendor/distlib/t64-arm.exe",
              "Lib/site-packages/pip/_vendor/distlib/t64.exe",
              "Lib/site-packages/pip/_vendor/distlib/w32.exe",
              "Lib/site-packages/pip/_vendor/distlib/w64-arm.exe",
              "Lib/site-packages/pip/_vendor/distlib/w64.exe",
          }
          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              assert package.testzip() is None, "CRC validation failed"
              assert len(names) == len(set(names)), "duplicate ZIP paths"
              assert not any("\\" in name for name in names), "backslash ZIP path"
              assert not any(name.startswith(("/", "\\")) or "../" in name.replace("\\", "/") for name in names), "unsafe ZIP path"
              executables = {name for name in names if name.casefold().endswith(".exe")}
              assert executables == allowed_executables, sorted(executables)
              assert not any("_runtime_console" in name.casefold() for name in names), "diagnostic runtime shipped"
              assert not any(name.casefold().endswith((".sqlite3", ".db", ".log", ".env", ".wal", ".shm")) for name in names), "runtime data shipped"
              assert package.read("PUBLIC_VERSION.txt").decode("utf-8").strip() == "1.2.0-dev"
              assert package.read("VERSION.txt").decode("utf-8").strip() == "1.2.0-dev"
              missing = required.difference(names)
              assert not missing, sorted(missing)
              assert not any(name.startswith("site-packages/openai_codex/") for name in names), "Codex SDK must be installed on demand"
              assert not any("codex.exe" in name.casefold() for name in names), "Codex runtime must not be bundled"
          print("RC7_ZIP_VALIDATION_OK")
          '@ | Set-Content validate_rc7_zip.py -Encoding utf8
          python validate_rc7_zip.py $zip
          if ($LASTEXITCODE -ne 0) { throw "RC7 ZIP validation failed" }
          Remove-Item validate_rc7_zip.py
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $scanner.FullName -Scan -ScanType 3 -File (Resolve-Path $zip).Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender ZIP scan failed" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content $hashFile -Encoding ascii
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hash_file=$hashFile" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload final RC7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v1.2.0-dev_Windows_RC7_FINAL
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.hash_file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
