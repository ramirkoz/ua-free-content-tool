name: Build Windows RC3 v1.2.0-dev

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.2.0-editorial-memory-media

permissions:
  contents: read

jobs:
  windows-rc:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate source and RC3 behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          python -m compileall -q .
          python -m pytest -q
          python tools/validate_v1_2_rc3.py
          python tools/check_entrypoint_imports.py
          python -c "import PIL, content_agent.main; from content_agent.ui.v1_2_rc3_final_window import MainWindow; print('RC3_SOURCE_GATE_OK', PIL.__version__)"

      - name: Stamp isolated RC version
        shell: pwsh
        run: |
          "1.2.0-dev" | Set-Content PUBLIC_VERSION.txt -Encoding ascii
          "1.2.0-dev" | Set-Content VERSION.txt -Encoding ascii

      - name: Build signed portable runtime
        shell: cmd
        run: Build_Portable_Windows.bat

      - name: Validate signed runtime and GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v1.2.0-dev\UA_FREE_Content_Tool").Path
          $exe = (Resolve-Path (Join-Path $root "UA_FREE_Content_Tool.exe")).Path
          $console = (Resolve-Path (Join-Path $root "_runtime_console.exe")).Path
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne "Valid") { throw "Invalid launcher signature: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch "Python Software Foundation") { throw "Unexpected launcher signer" }
          Push-Location $root
          try {
            & $console -I -c "import PIL, content_agent.main; from content_agent.ui.v1_2_rc3_final_window import MainWindow; import tkinter as tk; r=tk.Tk(); r.withdraw(); r.update_idletasks(); r.destroy(); print('RC3_RUNTIME_OK')"
            if ($LASTEXITCODE -ne 0) { throw "Runtime import failed" }
          } finally { Pop-Location }
          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Portable GUI exited during smoke test" }
          Stop-Process -Id $process.Id -Force
          if (-not (Test-Path (Join-Path $root "Data\content_agent.sqlite3"))) { throw "Portable startup did not create local database" }
          Remove-Item $console -Force
          Remove-Item (Join-Path $root "_runtime_console._pth") -Force
          Remove-Item (Join-Path $root "Data\*") -Recurse -Force -ErrorAction SilentlyContinue

      - name: Defender scan extracted runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v1.2.0-dev\UA_FREE_Content_Tool").Path
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) { throw "Defender scanner unavailable" }
          & $scanner.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender update failed" }
          & $scanner.FullName -Scan -ScanType 3 -File $root -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender runtime scan failed" }

      - name: Package and validate RC3
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "Release\UA_FREE_Content_Tool_v1.2.0-dev\UA_FREE_Content_Tool"
          $zip = "UA_FREE_Content_Tool_v1.2.0-dev_Windows_Portable_RC3.zip"
          $hashFile = "UA_FREE_Content_Tool_v1.2.0-dev_RC3_SHA256.txt"
          Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal
          @'
          import pathlib, sys, zipfile
          p = pathlib.Path(sys.argv[1])
          required = {
            "content_agent/ui/v1_2_rc3_window.py",
            "content_agent/ui/v1_2_rc3_instagram_window.py",
            "content_agent/ui/v1_2_rc3_final_window.py",
            "content_agent/strict_ollama_decode_v1_2_rc3.py",
            "content_agent/rewriter_v1_2_rc3.py",
            "content_agent/short_source_v1_2_rc3.py",
            "content_agent/editorial_memory_v1_2_rc3.py",
            "content_agent/topic_search_v1_2_rc3.py",
            "content_agent/media_discovery_v1_2_rc3.py",
            "content_agent/media_order_v1_2_rc3.py",
            "content_agent/media_hint_store_v1_2_rc3.py",
            "content_agent/rss_media_hints_v1_2_rc3.py",
            "content_agent/comment_phase_v1_2_rc3.py",
            "content_agent/facebook_comments_v1_2_rc3.py",
            "content_agent/threads_comments_v1_2_rc3.py",
            "content_agent/linkedin_comments_v1_2_rc3.py",
            "content_agent/comment_compat_v1_2_rc3.py",
            "content_agent/publisher_factory_v1_2_rc3_compat.py",
          }
          with zipfile.ZipFile(p) as z:
            names = z.namelist()
            assert z.testzip() is None
            assert len(names) == len(set(names))
            assert [n for n in names if n.casefold().endswith('.exe')] == ['UA_FREE_Content_Tool.exe']
            assert not any('\\' in n or n.startswith('/') or '../' in n.replace('\\','/') for n in names)
            assert not any(n.casefold().endswith(('.sqlite3','.db','.log','.env','.wal','.shm')) for n in names)
            assert z.read('PUBLIC_VERSION.txt').decode().strip() == '1.2.0-dev'
            assert z.read('VERSION.txt').decode().strip() == '1.2.0-dev'
            assert required.issubset(set(names)), sorted(required.difference(names))
          print('RC3_ZIP_OK')
          '@ | Set-Content rc3_zip_check.py -Encoding utf8
          python rc3_zip_check.py $zip
          Remove-Item rc3_zip_check.py
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $scanner.FullName -Scan -ScanType 3 -File (Resolve-Path $zip).Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender ZIP scan failed" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content $hashFile -Encoding ascii
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hash_file=$hashFile" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload RC3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v1.2.0-dev_Windows_RC3_FINAL
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.hash_file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
