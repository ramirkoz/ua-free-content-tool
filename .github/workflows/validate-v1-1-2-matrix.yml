name: Validate v1.1.2 matrix

on:
  push:
    branches:
      - feature/v1.1.2-metrics-prediction
    paths:
      - .github/workflows/validate-v1-1-2-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.1.2-metrics-prediction
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: Entrypoint imports
        run: python tools/check_entrypoint_imports.py
      - name: Import application
        run: python -c "import content_agent.main"
