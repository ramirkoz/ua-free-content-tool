name: RC55 apply Codex hash lock

on:
  push:
    branches: [rc55-final-consolidation-security]
    paths:
      - tools/rc55_codex_lock.py
      - .github/workflows/rc55-codex-lock-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc55-final-consolidation-security
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/rc55_codex_lock.py
      - name: Commit Codex hash lock
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_agent/codex_engine_v1_4_rc28.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "RC55: hash-lock Codex Windows runtime [skip ci]"
          git push origin HEAD:rc55-final-consolidation-security
