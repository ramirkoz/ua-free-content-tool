name: Publish existing RC7 release assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-existing-rc7-assets.yml'

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download already validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 32567837615 --repo "$GITHUB_REPOSITORY" \
            -n UA_FREE_Content_Tool_v1.3.1-rc7_RELEASE_ASSETS \
            -D release-assets
          test -f release-assets/UA_FREE_Content_Tool_v1.3.1-rc7_Windows_Portable.zip
          test -f release-assets/UA_FREE_Content_Tool_v1.3.1-rc7_Source.zip
          test -f release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Publish prerelease without invalid latest flag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.3.1-rc7
          portable=release-assets/UA_FREE_Content_Tool_v1.3.1-rc7_Windows_Portable.zip
          source=release-assets/UA_FREE_Content_Tool_v1.3.1-rc7_Source.zip
          sums=release-assets/SHA256SUMS.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$portable" "$source" "$sums" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title 'UA FREE Content Tool v1.3.1-rc7' \
              --notes-file RELEASE_NOTES_v1.3.1-rc7.md \
              --prerelease
          else
            gh release create "$tag" "$portable" "$source" "$sums" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title 'UA FREE Content Tool v1.3.1-rc7' \
              --notes-file RELEASE_NOTES_v1.3.1-rc7.md \
              --prerelease
          fi
          python - <<'PY'
          import json, os, subprocess
          raw = subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/v1.3.1-rc7"], text=True)
          data = json.loads(raw)
          names = {a['name'] for a in data.get('assets', [])}
          required = {
              'UA_FREE_Content_Tool_v1.3.1-rc7_Windows_Portable.zip',
              'UA_FREE_Content_Tool_v1.3.1-rc7_Source.zip',
              'SHA256SUMS.txt',
          }
          assert data.get('prerelease') is True, data.get('prerelease')
          assert required <= names, (required, names)
          print('RC7_GITHUB_RELEASE_PASS', data['html_url'], sorted(names))
          PY

      - name: Mark release finalization success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=rc7-release-final \
            -f description="run_id=$GITHUB_RUN_ID" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove one-time publisher
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-existing-rc7-assets.yml
          git commit -m 'Remove one-time RC7 release publisher'
          git push origin HEAD:main
