name: Dispatch secure v1.1.3 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/dispatch-v1-1-3-release.yml]

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time dispatcher from release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-v1-1-3-release.yml
          git commit -m 'Remove one-time v1.1.3 release dispatcher [skip ci]'
          git push origin HEAD:main
      - name: Dispatch permanent secure release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repository}/actions/workflows/release.yml/dispatches'
          payload = json.dumps({
              'ref': 'main',
              'inputs': {'version': '1.1.3', 'prerelease': 'false'},
          }).encode('utf-8')
          request = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ua-free-content-tool-release-dispatcher',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(f'Unexpected dispatch status: {response.status}')
          print('V1_1_3_RELEASE_DISPATCHED=true')
          PY
