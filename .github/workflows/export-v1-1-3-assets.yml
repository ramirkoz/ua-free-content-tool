name: Export verified v1.1.3 release assets

on:
  push:
    branches: [main]
    paths: [.github/workflows/export-v1-1-3-assets.yml]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exported
          gh release download v1.1.3 \
            --pattern 'UA_FREE_Content_Tool_v1.1.3_Windows_Portable.zip' \
            --pattern 'SHA256SUMS.txt' \
            --dir exported
      - name: Verify published portable checksum
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('exported')
          archive = root / 'UA_FREE_Content_Tool_v1.1.3_Windows_Portable.zip'
          sums = root / 'SHA256SUMS.txt'
          expected = None
          for line in sums.read_text(encoding='ascii').splitlines():
              digest, name = line.split(maxsplit=1)
              if name.strip() == archive.name:
                  expected = digest.lower()
                  break
          if expected is None:
              raise SystemExit('Portable checksum is missing from SHA256SUMS.txt')
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Published asset checksum mismatch: {actual} != {expected}')
          print(f'PUBLISHED_PORTABLE_SHA256={actual}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v1.1.3_verified_release_assets
          path: exported/*
          retention-days: 14
      - name: Remove one-time exporter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/export-v1-1-3-assets.yml
          git commit -m 'Remove one-time v1.1.3 asset exporter [skip ci]'
          git push origin HEAD:main
