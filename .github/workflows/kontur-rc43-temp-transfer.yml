name: KONTUR RC43 Temporary Transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kontur-rc43-temp-transfer.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify official RC43 release
        env:
          SIGNED_B64: ""
          EXPECTED_SHA: "b5eba416f6173b8e4211e58d94457e56fe0dc9b8adb8c6f9c597b6d59d6f0645"
        run: |
          set -euo pipefail
          mkdir -p inner payload
          url="$(printf '%s' "$SIGNED_B64" | base64 -d)"
          curl -fL --retry 2 "$url" -o inner/release.zip
          echo "${EXPECTED_SHA}  inner/release.zip" | sha256sum -c -
          unzip -q inner/release.zip -d payload
          test -f payload/KONTUR_RF.exe
          test -f payload/KONTUR_UpdateWatch_RC26.exe
          test -f payload/KONTUR_TransactionRunner_RC26.exe
      - name: Upload updater-ready bridge artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR_RC43_DRIVE_BRIDGE
          path: payload/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Print updater-ready digest
        run: echo "UPDATER_READY_SHA=${{ steps.upload.outputs.artifact-digest }}"
