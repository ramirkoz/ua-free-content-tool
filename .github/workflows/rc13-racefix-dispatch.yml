name: RC13 racefix dispatch

on:
  push:
    branches: [main]
    paths: [.github/workflows/rc13-racefix-dispatch.yml]

permissions:
  contents: write
  actions: write

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix manifest race and dispatch RC13
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          text = p.read_text(encoding='utf-8')
          old = '''      - name: Refresh repository manifest\n        shell: pwsh\n        run: |\n          $ErrorActionPreference = "Stop"\n          @'\n'''
          new = '''      - name: Refresh repository manifest\n        shell: pwsh\n        run: |\n          $ErrorActionPreference = "Stop"\n          git fetch origin main\n          if ($LASTEXITCODE -ne 0) { throw "Manifest prefetch failed: $LASTEXITCODE" }\n          git rebase origin/main\n          if ($LASTEXITCODE -ne 0) { throw "Manifest rebase failed: $LASTEXITCODE" }\n          @'\n'''
          if old not in text:
              raise SystemExit('release manifest step marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc13-racefix-dispatch.yml
          git add .github/workflows/release.yml
          git commit -m 'Fix release manifest synchronization race'
          git push origin HEAD:main
          gh workflow run release.yml --ref main -f version=1.3.1-rc13 -f prerelease=true
