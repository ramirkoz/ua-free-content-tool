name: Diagnose exact RC7 bootstrap

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[automation] diagnose exact RC7 bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest bootstrap run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bootstrap-sync-rc7.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            printf '%s\n' 'NO_BOOTSTRAP_RUN' > .github/rc7-bootstrap-diagnostics.txt
          else
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,headSha,event > .github/rc7-bootstrap-diagnostics.txt
            printf '\n--- FAILED LOG ---\n' >> .github/rc7-bootstrap-diagnostics.txt
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed >> .github/rc7-bootstrap-diagnostics.txt 2>&1 || true
          fi
      - name: Persist diagnostics and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/rc7-bootstrap-diagnostics.txt
          git rm .github/workflows/diag-bootstrap-rc7.yml
          git commit -m 'Record exact RC7 bootstrap diagnostics'
          git push origin HEAD:main
      - name: Close maintenance issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
