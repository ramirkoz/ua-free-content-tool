name: KONTUR RC41 Temporary Transfer Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kontur-rc41-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary KONTUR RC41 transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="KONTUR_RC41_TRANSFER") | .id' > ids.txt
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
          done < ids.txt
