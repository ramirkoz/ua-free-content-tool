name: Bootstrap exact RC7 source synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-sync-rc7.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RC7 synchronization branch
        uses: actions/checkout@v4
        with:
          ref: sync/v1.3.1-rc7-final
          fetch-depth: 0

      - name: Decode and verify RC7 delta transport
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .sync/rc7.patch.xz.b64 | xz -d > /tmp/rc7.patch
          echo '29cf14742ff34b4a7260ada6a158435d5d59635acab9472587982f06a2d90e7f  /tmp/rc7.patch' | sha256sum -c -

      - name: Normalize files and select only missing RC7 diffs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import re
          import subprocess
          from pathlib import Path

          patch = Path('/tmp/rc7.patch').read_text(encoding='utf-8')
          selected: list[str] = []
          expected: dict[str, str] = {}
          report: list[str] = []

          for raw in patch.split('diff --git ')[1:]:
              section = 'diff --git ' + raw
              first = raw.splitlines()[0]
              parts = first.split()
              if len(parts) != 2:
                  raise SystemExit(f'Unexpected diff header: {first!r}')
              new_path = parts[1]
              prefix = 'tmp/cc7src/'
              if not new_path.startswith(prefix):
                  raise SystemExit(f'Unexpected target path: {new_path}')
              path = new_path[len(prefix):]
              match = re.search(r'^index ([0-9a-f]+)\.\.([0-9a-f]+)', section, re.M)
              if not match:
                  raise SystemExit(f'Missing index line for {path}')
              base_sha, target_sha = match.groups()
              expected[path] = target_sha

              file_path = Path(path)
              if not file_path.is_file():
                  raise SystemExit(f'Missing repository file: {path}')
              data = file_path.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
              file_path.write_bytes(data)
              current = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if current.startswith(target_sha):
                  report.append(f'TARGET {path} {current}')
              elif current.startswith(base_sha):
                  report.append(f'APPLY  {path} {current} -> {target_sha}')
                  selected.append(section)
              else:
                  raise SystemExit(
                      f'Fail-closed: {path} is neither RC6 base {base_sha} nor RC7 target {target_sha}; current={current}'
                  )

          Path('/tmp/filtered.patch').write_text(''.join(selected), encoding='utf-8', newline='\n')
          print('\n'.join(report))
          print(f'Selected sections: {len(selected)} / {len(expected)}')
          PY

          if [ -s /tmp/filtered.patch ]; then
            git apply --whitespace=nowarn -p2 /tmp/filtered.patch
          fi

      - name: Verify exact target file hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import re
          import subprocess
          from pathlib import Path

          patch = Path('/tmp/rc7.patch').read_text(encoding='utf-8')
          failures: list[str] = []
          checked = 0
          for raw in patch.split('diff --git ')[1:]:
              section = 'diff --git ' + raw
              first = raw.splitlines()[0]
              path = first.split()[1].removeprefix('tmp/cc7src/')
              target = re.search(r'^index [0-9a-f]+\.\.([0-9a-f]+)', section, re.M).group(1)
              current = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              checked += 1
              if not current.startswith(target):
                  failures.append(f'{path}: expected {target}, got {current}')
          if failures:
              raise SystemExit('RC7 verification failed:\n' + '\n'.join(failures))
          print(f'RC7 exact verification PASS: {checked} changed files')
          PY
          python -m compileall -q content_agent

      - name: Commit exact RC7 source to synchronization branch
        shell: bash
        run: |
          set -euo pipefail
          find content_agent -type d -name __pycache__ -prune -exec rm -rf {} + || true
          rm -f .sync/rc7.patch.xz.b64
          rmdir .sync 2>/dev/null || true
          rm -f .github/workflows/sync-rc7-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize exact v1.3.1-rc7 source'
          git push origin HEAD:sync/v1.3.1-rc7-final

      - name: Remove bootstrap workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/bootstrap-sync-rc7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove RC7 synchronization bootstrap'
          git push origin HEAD:main
