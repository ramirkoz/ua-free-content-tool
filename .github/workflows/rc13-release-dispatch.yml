name: RC13 release dispatch

on:
  push:
    branches: [main]
    paths: [.github/workflows/rc13-release-dispatch.yml]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch RC13 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version=1.3.1-rc13 -f prerelease=true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc13-release-dispatch.yml
          git commit -m 'Remove RC13 release dispatch helper'
          git push origin HEAD:main
