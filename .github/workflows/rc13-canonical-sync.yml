name: RC13 canonical source sync

on:
  push:
    branches: [main]
    paths: [.github/workflows/rc13-canonical-sync.yml]

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested RC13 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git apply --ignore-space-change --ignore-whitespace .rc13-core.patch
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          replace('VERSION.txt', '1.3.1-rc12', '1.3.1-rc13')
          replace('PUBLIC_VERSION.txt', '1.3.1-rc12', '1.3.1-rc13')
          replace('content_agent/__init__.py', '1.3.1-rc12', '1.3.1-rc13')
          replace('README.md', 'v1.3.1-rc12', 'v1.3.1-rc13')
          replace('README.md', 'RELEASE_NOTES_v1.3.1-rc12.md', 'RELEASE_NOTES_v1.3.1-rc13.md')
          replace('content_agent/ui/v1_3_window.py', '1.3.1-rc12', '1.3.1-rc13')
          replace('content_agent/ui/queue_safety_v1_3_1_rc1.py', 'self.worker.request_cancel(batch.id)', 'self.worker.request_cancel(batch.id, reason="queue-ui-confirmed")')
          replace('tests/test_r8_fix8.py', 'monkeypatch.setattr("content_agent.google_drive.probe_public_media", lambda _file_id: (True, "image/jpeg"))', 'probes = iter([(False, ""), (True, "image/jpeg")])\n    monkeypatch.setattr("content_agent.google_drive.probe_public_media", lambda _file_id: next(probes))')
          PY
          rm -f .rc13-core.patch \
            .github/workflows/rc13-sync.yml \
            .github/workflows/rc13-sync2.yml \
            .github/workflows/rc13-canonical-sync.yml
          python -m compileall -q content_agent tests app.py
          python -m pytest -q tests/test_rc13_publication_stability.py tests/test_r8_fix8.py tests/test_rc12_stability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v1.3.1-rc13 publication stabilization'
          git push origin HEAD:main
          gh workflow run release.yml --ref main
