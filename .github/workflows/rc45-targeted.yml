name: RC45 reliability regression gate

on:
  push:
    branches: [rc45-reliability-fixes]
  pull_request:
    branches: [main]
    paths:
      - content_agent/backup.py
      - content_agent/main.py
      - content_agent/clean_import.py
      - content_agent/rewrite_pipeline_v1_4_rc27.py
      - content_agent/v2/ai/service.py
      - content_agent/v2/publishing/retry.py
      - content_agent/v2/storage/factory.py
      - content_agent/v2/storage/reliable.py
      - content_agent/v2/ui/manual_topics_window_rc44.py
      - tests/test_rc45_reliability.py
      - .github/workflows/rc45-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-regressions:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application
        shell: pwsh
        run: python -m compileall -q content_agent tests/test_rc45_reliability.py tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
      - name: RC45 reliability regressions
        shell: pwsh
        run: python -m pytest -q tests/test_rc45_reliability.py
      - name: RC45 adds no new versioned runtime layer
        shell: pwsh
        run: |
          $bad = Get-ChildItem content_agent -Recurse -File -Filter *.py | Where-Object {
            $_.Name -match '(^|_)rc45(_|\.|$)' -or $_.Name -match 'window_rc45'
          }
          if ($bad) { throw "RC45 must not add a new versioned runtime layer: $($bad.FullName -join ', ')" }
      - name: Keep RC44 and RC43 topic regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
      - name: Keep RC42 Instagram multi-account regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
      - name: Keep RC41 Drive auth regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
