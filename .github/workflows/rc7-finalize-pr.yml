name: Finalize exact RC7 sync branch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'trigger/rc7-finalize-execute'
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: sync/v1.3.1-rc7-final
          fetch-depth: 0

      - name: Apply exact remaining RC7 source and verify 129 files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path

          SPECS = {
              'eol': ('.sync/rc7-eol-93.json.xz.b64', '8e8db9e71a5c6bc01bf83950911bc5d55c6e9412c043e7127474163594c905c9'),
              'real': ('.sync/rc7-real-9.json.xz.b64', '9c0e490de53a986878e66c88b895e2015b775ac1f42734854f684dfb81a115d3'),
              'manifest': ('.sync/rc7-target-129.json.xz.b64', 'e2886703d9d75e51dcaec85acb89eed4f20295c2ab5dada70bc1b27398adbd17'),
          }

          def load(name):
              path, expected_raw_sha = SPECS[name]
              raw = lzma.decompress(base64.b64decode(Path(path).read_text(encoding='ascii')))
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected_raw_sha:
                  raise SystemExit(f'{name} transport SHA mismatch: {actual}')
              return json.loads(raw.decode('utf-8'))

          def git_sha(path):
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()

          eol = load('eol')
          real = load('real')
          manifest = load('manifest')

          if len(eol.get('paths', [])) != 93 or len(real.get('ops', {})) != 9 or len(manifest.get('target', {})) != 129:
              raise SystemExit('RC7 transport cardinality mismatch')

          current = dict(eol['current'])
          current.update(real['current'])
          if len(current) != 102:
              raise SystemExit('RC7 current manifest must contain 102 unique files')
          failures=[]
          for path, expected in current.items():
              actual=git_sha(path)
              if actual != expected:
                  failures.append(f'{path}: expected current {expected}, got {actual}')
          if failures:
              raise SystemExit('Current sync snapshot mismatch:\n'+'\n'.join(failures))

          for path in eol['paths']:
              p=Path(path)
              data=p.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
              p.write_bytes(data.replace(b'\n', b'\r\n'))

          for path, changes in real['ops'].items():
              p=Path(path)
              lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
              for i1, i2, replacement in reversed(changes):
                  lines[int(i1):int(i2)] = str(replacement).splitlines(keepends=True)
              p.write_text(''.join(lines), encoding='utf-8', newline='')

          targets=manifest['target']
          failures=[]
          for path, expected in targets.items():
              actual=git_sha(path)
              if actual != expected:
                  failures.append(f'{path}: expected target {expected}, got {actual}')
          if failures:
              raise SystemExit('Exact RC7 verification failed:\n'+'\n'.join(failures))
          print('EXACT RC7 SOURCE PASS: 129/129 files')
          PY
          python -m compileall -q content_agent

      - name: Commit exact synchronized source
        shell: bash
        run: |
          set -euo pipefail
          find content_agent -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- .sync
          git add -A
          git commit -m 'Synchronize exact v1.3.1-rc7 source 129/129'
          git push origin HEAD:sync/v1.3.1-rc7-final
