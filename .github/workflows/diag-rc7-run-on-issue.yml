name: Diagnose rc7 sync run on maintenance issue

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[automation] diagnose Content Tool rc7 sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest sync runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow sync-content-rc7.yml --limit 5 --json databaseId,status,conclusion,url,headSha,displayTitle,event,createdAt > .github/rc7-run-status.json
      - name: Persist diagnostics and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc7-run-status.json
          git rm .github/workflows/diag-rc7-run-on-issue.yml
          git commit -m "Record rc7 sync workflow diagnostics"
          git push origin HEAD:main
      - name: Close maintenance issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
