name: RC50 final roadmap gate

on:
  push:
    branches: [rc50-roadmap-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    env:
      UA_FREE_TEST_PLAINTEXT_CONFIG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application
        shell: pwsh
        run: python -m compileall -q content_agent tests
      - name: RC50 AI UI contract
        shell: pwsh
        run: python -m pytest -q tests/test_rc50_ai_ui_contract.py
      - name: RC50 architecture registry and composition
        shell: pwsh
        run: python -m pytest -q tests/test_rc50_architecture_contracts.py
      - name: RC50 signed update contract
        shell: pwsh
        run: python -m pytest -q tests/test_rc50_update_security.py
      - name: RC50 real Tk startup and layout smoke
        shell: pwsh
        run: python -m pytest -q tests/test_rc50_real_ui_smoke.py
      - name: Keep RC49 startup regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc49_startup_contract.py tests/test_rc49_runtime_smoke.py
      - name: Keep RC48 UX and reliability regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc48_ux_reliability.py
      - name: Keep RC47 composition contracts green
        shell: pwsh
        run: python -m pytest -q tests/test_rc47_composition_contracts.py
      - name: Keep RC46 clean import regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc46_clean_import_wrapper.py
      - name: Keep RC45 reliability regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc45_reliability.py
      - name: Keep RC44 through RC41 focused regressions green
        shell: pwsh
        run: |
          python -m pytest -q tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
          python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
          python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: Backup v2 migration and restore regressions
        shell: pwsh
        run: python -m pytest -q tests -k "backup and not rc50_real_ui_smoke"
      - name: RC50 adds no versioned runtime layer
        shell: pwsh
        run: |
          $bad = Get-ChildItem content_agent -Recurse -File -Filter *.py | Where-Object {
            $_.Name -match '(^|_)rc50(_|\.|$)' -or $_.Name -match 'window_rc50'
          }
          if ($bad) { throw "RC50 must not add a versioned runtime layer: $($bad.FullName -join ', ')" }
      - name: Full repository suite
        shell: pwsh
        run: python -m pytest -q
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package RC50 portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc50') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC50.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc50_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc50_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC50.txt
          if-no-files-found: error
