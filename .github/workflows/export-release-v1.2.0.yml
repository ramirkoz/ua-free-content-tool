name: Export v1.2.0 release assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-release-v1.2.0.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-files
          gh release download v1.2.0 \
            --repo ramirkoz/ua-free-content-tool \
            --dir release-files \
            --pattern 'UA_FREE_Content_Tool_v1.2.0_Windows_Portable.zip' \
            --pattern 'UA_FREE_Content_Tool_v1.2.0_Source.zip' \
            --pattern 'SHA256SUMS.txt'

      - name: Upload release files for Drive sync
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v1.2.0_RELEASE_FILES
          path: release-files/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
