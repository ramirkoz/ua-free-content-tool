name: Export RC7 sync snapshot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'trigger/rc7-export-snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: sync/v1.3.1-rc7-final
          fetch-depth: 1
      - name: Prepare exact current snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot/content_agent/ui
          cp content_agent/ai_router_v1_2_1.py snapshot/content_agent/
          cp content_agent/ai_router_v1_2_2.py snapshot/content_agent/
          cp content_agent/database.py snapshot/content_agent/
          cp content_agent/rewrite_pipeline_v1_3.py snapshot/content_agent/
          cp content_agent/ui/ai_engine_v1_3.py snapshot/content_agent/ui/
          cp content_agent/ui/main_window.py snapshot/content_agent/ui/
          git hash-object snapshot/content_agent/ai_router_v1_2_1.py > snapshot/current_git_sha.txt
          git hash-object snapshot/content_agent/ai_router_v1_2_2.py >> snapshot/current_git_sha.txt
          git hash-object snapshot/content_agent/database.py >> snapshot/current_git_sha.txt
          git hash-object snapshot/content_agent/rewrite_pipeline_v1_3.py >> snapshot/current_git_sha.txt
          git hash-object snapshot/content_agent/ui/ai_engine_v1_3.py >> snapshot/current_git_sha.txt
          git hash-object snapshot/content_agent/ui/main_window.py >> snapshot/current_git_sha.txt
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rc7-current-sync-snapshot
          path: snapshot
          if-no-files-found: error
          retention-days: 1
