name: Finalize RC7 legacy tests

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  finalize-tests:
    if: github.event.pull_request.head.ref == 'trigger/rc7-tests-final'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v1.3.1-rc7-final
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply exact legacy-test alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'tests/test_local_ai_runtime_v1_2_2.py': [
              ('    assert result.provider == "nvidia"\n    assert "provider:nvidia" not in state.cooldowns',
               '    assert result.provider == "groq"\n    assert calls[0] == next(slot.label for slot in legacy.MODEL_SLOTS if slot.provider == "nvidia")\n    assert any("Groq" in item for item in calls[1:])\n    assert "provider:nvidia" not in state.cooldowns'),
            ],
            'tests/test_r8_fix13.py': [('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")')],
            'tests/test_r8_fix14.py': [('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")')],
            'tests/test_r8_fix15.py': [('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")')],
            'tests/test_r8_fix17.py': [('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")')],
            'tests/test_r8_fix19.py': [('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")')],
            'tests/test_r8_fix23.py': [('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")')],
            'tests/test_r8_fix27.py': [
              ('    core = "Ф" * EDITORIAL_TEXT_LIMIT',
               '    seed = "Підтверджений факт без службового тексту. "\n    core = (seed * ((EDITORIAL_TEXT_LIMIT // len(seed)) + 2))[:EDITORIAL_TEXT_LIMIT]'),
              ('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")'),
            ],
            'tests/test_r8_fix28.py': [('root.title("UA FREE Content Tool — v1.1.2")', 'root.title("UA FREE Content Tool — v1.3.1-rc7")')],
          }

          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one occurrence, found {count}: {old[:80]}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8', newline='')
          print('Legacy test alignment applied exactly')
          PY

      - name: Run complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          python -m compileall -q content_agent tests
          python -m pytest -q
          python tools/check_entrypoint_imports.py
          python -c 'import content_agent.main'

      - name: Commit only aligned tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_local_ai_runtime_v1_2_2.py tests/test_r8_fix13.py tests/test_r8_fix14.py tests/test_r8_fix15.py tests/test_r8_fix17.py tests/test_r8_fix19.py tests/test_r8_fix23.py tests/test_r8_fix27.py tests/test_r8_fix28.py
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Align remaining legacy regressions with v1.3.1-rc7'
          git push origin HEAD:sync/v1.3.1-rc7-final
