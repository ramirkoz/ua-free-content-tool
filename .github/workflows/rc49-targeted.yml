name: RC49 startup and data gate

on:
  push:
    branches: [rc49-startup-data-ai]
  pull_request:
    branches: [main]
    paths:
      - content_agent/main.py
      - content_agent/database_v1_4_rc21.py
      - content_agent/v2/storage/migrations.py
      - content_agent/v2/supervisor/runtime.py
      - tests/test_rc49_startup_contract.py
      - tests/test_rc48_ux_reliability.py
      - tests/test_rc47_composition_contracts.py
      - tests/test_rc46_clean_import_wrapper.py
      - tests/test_rc45_reliability.py
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - content_agent/__init__.py
      - RELEASE_NOTES_v2.0.0-rc49.md
      - .github/workflows/rc49-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application
        shell: pwsh
        run: python -m compileall -q content_agent tests/test_rc49_startup_contract.py tests/test_rc48_ux_reliability.py tests/test_rc47_composition_contracts.py tests/test_rc46_clean_import_wrapper.py tests/test_rc45_reliability.py
      - name: RC49 startup readiness and indexed telemetry regressions
        shell: pwsh
        run: python -m pytest -q tests/test_rc49_startup_contract.py
      - name: Keep RC48 UX and reliability regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc48_ux_reliability.py
      - name: Keep RC47 composition regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc47_composition_contracts.py
      - name: Keep RC46 clean import regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc46_clean_import_wrapper.py
      - name: Keep RC45 reliability regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc45_reliability.py
      - name: RC49 adds no new versioned runtime layer
        shell: pwsh
        run: |
          $bad = Get-ChildItem content_agent -Recurse -File -Filter *.py | Where-Object {
            $_.Name -match '(^|_)rc49(_|\.|$)' -or $_.Name -match 'window_rc49'
          }
          if ($bad) { throw "RC49 must not add a new versioned runtime layer: $($bad.FullName -join ', ')" }
      - name: Keep RC44 and RC43 topic regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
      - name: Keep RC42 Instagram multi-account regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
      - name: Keep RC41 Drive auth regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc49') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC49.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc49_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc49_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC49.txt
          if-no-files-found: error
