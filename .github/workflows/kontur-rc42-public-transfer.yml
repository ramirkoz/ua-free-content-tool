name: KONTUR RC42 Temporary Public Transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kontur-rc42-public-transfer.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify RC42
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://tempfile.org/qwZQH2ofNGB/download -o rc42.zip
          echo 'efed02358fd7530d52c1a4ce2daa2c0950b85fe6267a2deb5546e46ce4f69c80  rc42.zip' | sha256sum -c -
          mkdir payload
          unzip -q rc42.zip -d payload
          test -f payload/KONTUR_RF.exe
          test -f payload/KONTUR_UpdateWatch_RC26.exe
          test -f payload/KONTUR_TransactionRunner_RC26.exe
      - name: Upload updater-ready artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR_RC42_DRIVE_BRIDGE
          path: payload/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Print artifact digest
        shell: bash
        run: echo "RC42_ARTIFACT_SHA256=${{ steps.upload.outputs.artifact-digest }}"
