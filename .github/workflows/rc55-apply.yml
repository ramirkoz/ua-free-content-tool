name: RC55 apply final patches

on:
  workflow_dispatch:
  push:
    branches: [rc55-final-consolidation-security]
    paths:
      - tools/rc55_apply.py
      - .github/workflows/rc55-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc55-final-consolidation-security
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply RC55 deterministic patches
        shell: pwsh
        run: python tools/rc55_apply.py
      - name: Commit RC55 code changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt PUBLIC_VERSION.txt content_agent tests
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "RC55: final UI and regression reconciliation [skip ci]"
          git push origin HEAD:rc55-final-consolidation-security
