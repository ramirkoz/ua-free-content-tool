name: Build, scan, and publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "1.1.3"
      prerelease:
        description: Publish as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $publicVersion = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          $internalVersion = (Get-Content VERSION.txt -Raw).Trim()
          $notes = "RELEASE_NOTES_v$version.md"
          if ($publicVersion -ne $version) {
            throw "PUBLIC_VERSION.txt contains $publicVersion, requested release is $version"
          }
          if ($internalVersion -ne $version) {
            throw "VERSION.txt contains $internalVersion, requested release is $version"
          }
          if (-not (Test-Path $notes)) {
            throw "Release notes not found: $notes"
          }

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt

      - name: Validate source
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q
          python tools/check_entrypoint_imports.py
          python -c "import content_agent.main"

      - name: Refresh repository manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import hashlib

          root = Path.cwd()
          lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == "FILE_MANIFEST.sha256":
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")

          (root / "FILE_MANIFEST.sha256").write_text(
              "\n".join(lines) + "\n",
              encoding="ascii",
              newline="\n",
          )
          '@ | python -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FILE_MANIFEST.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Refresh repository manifest for v${{ inputs.version }}"
            git push origin HEAD:main
          } else {
            Write-Host "Manifest is already current."
          }

      - name: Build signed portable runtime
        shell: cmd
        run: Build_Portable_Windows.bat

      - name: Validate signed launcher and portable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool").Path
          $exe = (Resolve-Path (Join-Path $root "UA_FREE_Content_Tool.exe")).Path
          $console = (Resolve-Path (Join-Path $root "_runtime_console.exe")).Path

          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne "Valid") {
            throw "Launcher signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch "Python Software Foundation") {
            throw "Unexpected launcher signer: $($signature.SignerCertificate.Subject)"
          }

          Push-Location $root
          try {
            & $console -I -c "import content_agent.main; import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy(); print('SIGNED_RUNTIME_IMPORT_AND_TK_OK')"
            if ($LASTEXITCODE -ne 0) { throw "Isolated signed runtime validation failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Portable application exited during startup smoke test: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          if (-not (Test-Path (Join-Path $root "Data\content_agent.sqlite3"))) {
            throw "Portable startup did not create its local database"
          }

          Remove-Item $console -Force
          Remove-Item (Join-Path $root "_runtime_console._pth") -Force
          Remove-Item (Join-Path $root "Data\*") -Recurse -Force -ErrorAction SilentlyContinue

      - name: Update Defender and scan extracted runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool").Path
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) { throw "Microsoft Defender command-line scanner is unavailable" }
          & $scanner.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender signature update failed: $LASTEXITCODE" }
          & $scanner.FullName -Scan -ScanType 3 -File $root -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender detected or could not scan the extracted runtime: $LASTEXITCODE" }

      - name: Prepare and validate release assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $releaseRoot = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          $portableZip = "UA_FREE_Content_Tool_v${version}_Windows_Portable.zip"
          $sourceZip = "UA_FREE_Content_Tool_v${version}_Source.zip"
          $checksums = "SHA256SUMS.txt"

          Compress-Archive -Path "$releaseRoot\*" -DestinationPath $portableZip -CompressionLevel Optimal
          git archive --format=zip --output=$sourceZip HEAD

          @'
          import pathlib, zipfile, sys
          archive = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert z.testzip() is None, "CRC validation failed"
              assert len(names) == len(set(names)), "duplicate ZIP paths"
              assert not any("\\" in name for name in names), "backslash ZIP path"
              assert not any(name.startswith(("/", "\\")) or "../" in name.replace("\\", "/") for name in names), "unsafe ZIP path"
              assert "UA_FREE_Content_Tool.exe" in names, "launcher missing"
              assert not any("_runtime_console" in name.casefold() for name in names), "diagnostic runtime shipped"
              assert not any(name.casefold().endswith((".sqlite3", ".db", ".log", ".env")) for name in names), "runtime data shipped"
          print("RELEASE_ZIP_VALIDATION_OK")
          '@ | Set-Content validate_release_zip.py -Encoding utf8
          python validate_release_zip.py $portableZip
          Remove-Item validate_release_zip.py

          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $scanner.FullName -Scan -ScanType 3 -File (Resolve-Path $portableZip).Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender detected or could not scan the release ZIP: $LASTEXITCODE" }

          $portableHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$portableHash  $portableZip",
            "$sourceHash  $sourceZip"
          ) | Set-Content -Path $checksums -Encoding ascii

          "portable_zip=$portableZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_zip=$sourceZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksums=$checksums" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish or refresh GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          $notes = "RELEASE_NOTES_v$version.md"
          $portableZip = "${{ steps.assets.outputs.portable_zip }}"
          $sourceZip = "${{ steps.assets.outputs.source_zip }}"
          $checksums = "${{ steps.assets.outputs.checksums }}"
          $head = (git rev-parse HEAD).Trim()

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force $tag $head
          git push origin "refs/tags/$tag" --force

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $portableZip $sourceZip $checksums --clobber
            $arguments = @("release", "edit", $tag, "--target", "main", "--title", "UA FREE Content Tool v$version", "--notes-file", $notes, "--latest")
          } else {
            $arguments = @("release", "create", $tag, $portableZip, $sourceZip, $checksums, "--target", "main", "--title", "UA FREE Content Tool v$version", "--notes-file", $notes, "--latest")
          }
          if ("${{ inputs.prerelease }}" -eq "true") { $arguments += "--prerelease" }
          & gh @arguments
