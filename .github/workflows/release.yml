name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "1.0.0"
      prerelease:
        description: Publish as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Refresh repository manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import hashlib

          root = Path.cwd()
          lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == "FILE_MANIFEST.sha256":
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")

          (root / "FILE_MANIFEST.sha256").write_text(
              "\n".join(lines) + "\n",
              encoding="ascii",
              newline="\n",
          )
          '@ | python -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FILE_MANIFEST.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Refresh repository manifest"
            git push origin HEAD:main
          } else {
            Write-Host "Manifest is already current."
          }

      - name: Build validated portable package
        shell: cmd
        run: Build_Portable_Windows.bat

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $releaseRoot = "Release\UA_FREE_Content_Tool_R8_FIX30\UA_FREE_Content_Tool"
          $portableZip = "UA_FREE_Content_Tool_v${version}_Windows_Portable.zip"
          $sourceZip = "UA_FREE_Content_Tool_v${version}_Source.zip"
          $checksums = "SHA256SUMS.txt"

          if (-not (Test-Path $releaseRoot)) {
            throw "Portable release folder not found: $releaseRoot"
          }

          Compress-Archive -Path "$releaseRoot\*" -DestinationPath $portableZip -CompressionLevel Optimal
          git archive --format=zip --output=$sourceZip HEAD

          $portableHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            "$portableHash  $portableZip",
            "$sourceHash  $sourceZip"
          ) | Set-Content -Path $checksums -Encoding ascii

          "portable_zip=$portableZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_zip=$sourceZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksums=$checksums" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish or refresh GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          $portableZip = "${{ steps.assets.outputs.portable_zip }}"
          $sourceZip = "${{ steps.assets.outputs.source_zip }}"
          $checksums = "${{ steps.assets.outputs.checksums }}"
          $head = (git rev-parse HEAD).Trim()

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force $tag $head
          git push origin "refs/tags/$tag" --force

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $portableZip $sourceZip $checksums --clobber
            $arguments = @(
              "release", "edit", $tag,
              "--target", "main",
              "--title", "UA FREE Content Tool v$version",
              "--notes-file", "RELEASE_NOTES_v1.0.0.md",
              "--latest"
            )
            if ("${{ inputs.prerelease }}" -eq "true") {
              $arguments += "--prerelease"
            }
            & gh @arguments
          } else {
            $arguments = @(
              "release", "create", $tag,
              $portableZip,
              $sourceZip,
              $checksums,
              "--target", "main",
              "--title", "UA FREE Content Tool v$version",
              "--notes-file", "RELEASE_NOTES_v1.0.0.md",
              "--latest"
            )
            if ("${{ inputs.prerelease }}" -eq "true") {
              $arguments += "--prerelease"
            }
            & gh @arguments
          }
