name: Sync V2 RC2 compatibility files

on:
  push:
    branches:
      - sync/v2.0.0-rc2
    paths:
      - .github/workflows/sync-v2-rc2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v2.0.0-rc2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact RC2 compatibility deltas
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          p = Path('content_agent/ai_router.py')
          text = p.read_text(encoding='utf-8')
          old = 'def run_ai(\n    prompt: str,\n    *,\n    validator: Callable[[str], object] | None = None,'
          new = 'def run_ai_router(\n    prompt: str,\n    *,\n    validator: Callable[[str], object] | None = None,'
          if old not in text:
              raise SystemExit('RC30 run_ai definition not found')
          text = text.replace(old, new, 1)
          anchor = '\n\ndef last_ai_result_label() -> str:\n'
          wrapper = '''\n\n\ndef run_ai(\n    prompt: str,\n    *,\n    validator: Callable[[str], object] | None = None,\n    max_output_tokens: int = 4096,\n    local_prompt: str | None = None,\n    local_max_output_tokens: int | None = None,\n    local_timeout_seconds: int = 120,\n    local_repair: bool = True,\n    cloud_timeout_seconds: int = 120,\n    task_timeout_seconds: int | None = None,\n    skip_providers: set[str] | frozenset[str] | tuple[str, ...] = (),\n    skip_models: set[str] | frozenset[str] | tuple[str, ...] = (),\n    suppress_provider_on_quota: bool = False,\n    cancel_event: object | None = None,\n) -> AIResult:\n    """V2 hard-switch entry point while preserving the RC30 call contract.\n\n    The legacy multi-provider implementation remains available as\n    :func:`run_ai_router` and is used only when the selected V2 backend is\n    ``router``. OpenRouter and Agent modes cannot silently fall through here.\n    """\n    from .v2.ai.service import run_ai_compat\n\n    return run_ai_compat(\n        prompt,\n        validator=validator,\n        max_output_tokens=max_output_tokens,\n        local_prompt=local_prompt,\n        local_max_output_tokens=local_max_output_tokens,\n        local_timeout_seconds=local_timeout_seconds,\n        local_repair=local_repair,\n        cloud_timeout_seconds=cloud_timeout_seconds,\n        task_timeout_seconds=task_timeout_seconds,\n        skip_providers=skip_providers,\n        skip_models=skip_models,\n        suppress_provider_on_quota=suppress_provider_on_quota,\n        cancel_event=cancel_event,\n    )\n\ndef last_ai_result_label() -> str:\n    # V2 may run OpenRouter or Agent exclusively. Prefer the unified V2 result\n    # when one exists so legacy UI/history does not falsely label it as Router.\n    try:\n        from .v2.ai.service import active_backend as _v2_active_backend, last_result as _v2_last_result\n        backend = _v2_active_backend()\n        current = _v2_last_result()\n        if backend != "router" and current is not None:\n            return str(current.label or current.model or backend)\n    except Exception:\n        pass\n'''
          if anchor not in text:
              raise SystemExit('last_ai_result_label anchor not found')
          text = text.replace(anchor, wrapper, 1)
          text = text.replace('def test_ai_router() -> str:\n    result = run_ai(\n', 'def test_ai_router() -> str:\n    result = run_ai_router(\n', 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          replace(
              'content_agent/ui/main_window_enhancements.py',
              'if re.fullmatch(r"\\d+(?:\\.\\d+){1,3}", value):',
              'if re.fullmatch(r"\\d+(?:\\.\\d+){1,3}(?:-rc\\d+)?", value):',
          )
          replace(
              'content_agent/ui/queue_migration_codex_v1_3.py',
              'self.generate_button.configure(text="Переробити всі через AI Router")',
              'self.generate_button.configure(text="Переробити всі через активний AI backend")',
          )
          replace(
              'content_agent/ui/queue_migration_codex_v1_3.py',
              'self._set_busy(True, "AI Router послідовно стискає тексти. Черга та планувальник залишаються вимкненими.")',
              'self._set_busy(True, "Активний AI backend послідовно стискає тексти. Черга та планувальник залишаються вимкненими.")',
          )
          replace(
              'content_agent/ui/queue_migration_codex_v1_3.py',
              '"Стискання через AI Router завершено. Перегляньте кожен текст і за потреби виправте вручну.",',
              '"Стискання через активний AI backend завершено. Перегляньте кожен текст і за потреби виправте вручну.",',
          )
      - name: Validate patched source
        shell: bash
        run: |
          python -m compileall -q content_agent
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'content_agent/ai_router.py': 'acf3ef5516a96f4abfd09a57354bd05f08dab2d7',
            'content_agent/ui/main_window_enhancements.py': 'fa531f3d2591bd3f5d5c653c644aeeac2008cf30',
            'content_agent/ui/queue_migration_codex_v1_3.py': '832bedac604c14dbd5a045960c303a6bcb0ea5df',
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1((f'blob {len(data)}\0').encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'{name}: git blob mismatch {actual} != {wanted}')
          print('RC2_COMPAT_FILES_EXACT')
          PY
      - name: Commit synchronized compatibility files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_agent/ai_router.py content_agent/ui/main_window_enhancements.py content_agent/ui/queue_migration_codex_v1_3.py
          git diff --cached --quiet && exit 0
          git commit -m "V2 RC2: synchronize compatibility bridge"
          git push origin HEAD:sync/v2.0.0-rc2
