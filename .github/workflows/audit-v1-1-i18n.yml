name: Audit v1.1.0 interface translations

on:
  push:
    branches:
      - feature/v1.1.0-bilingual-learning-inbox
    paths:
      - tools/audit_v1_1_i18n.py
      - .github/workflows/audit-v1-1-i18n.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/audit_v1_1_i18n.py
      - .github/workflows/audit-v1-1-i18n.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.1.0-bilingual-learning-inbox
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit visible UI literals
        run: python tools/audit_v1_1_i18n.py
