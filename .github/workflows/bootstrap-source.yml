name: Bootstrap validated public source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap-v1.0.0
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PACKAGE_URL: https://filebin.net/uafree-content-tool-20260802-fix30-4f9c1ab7/UA_FREE_Content_Tool_v1.0.0_GitHub_Repository_Package.zip
      PACKAGE_SHA256: a18f8833fa8c586974537d38d0484e922e42da9b95c001c6c8240df368f8e825
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Download and verify repository package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "$PACKAGE_URL" -o /tmp/repository-package.zip
          echo "$PACKAGE_SHA256  /tmp/repository-package.zip" | sha256sum -c -

      - name: Validate ZIP and extract exact repository root
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path('/tmp/repository-package.zip')
          destination = Path('/tmp/repository-package')
          destination.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              if zf.testzip() is not None:
                  raise SystemExit('ZIP CRC validation failed')
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate ZIP member names detected')
              roots = {name.split('/', 1)[0] for name in names if name}
              if roots != {'ua-free-content-tool'}:
                  raise SystemExit(f'Unexpected canonical root: {sorted(roots)}')
              for info in zf.infolist():
                  name = info.filename
                  path = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if name.startswith(('/', '\\')) or '\\' in name or '..' in path.parts:
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Symlink is not allowed: {name}')
              zf.extractall(destination)
          PY
          test -f /tmp/repository-package/ua-free-content-tool/README.md
          test -f /tmp/repository-package/ua-free-content-tool/content_agent/main.py

      - name: Replace repository tree with validated package
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' \
            /tmp/repository-package/ua-free-content-tool/ ./

      - name: Verify manifest and private-data exclusions
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c FILE_MANIFEST.sha256
          python - <<'PY'
          from pathlib import Path

          forbidden_exact = {
              'config.portable', 'portable.key', 'content_agent.sqlite3',
              'instance.lock', '.env'
          }
          forbidden_suffixes = {
              '.db', '.sqlite', '.sqlite3', '.sqlite3-wal', '.sqlite3-shm',
              '.log', '.token', '.secret', '.pem', '.p12', '.pfx'
          }
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix()
              name = path.name.lower()
              if rel.startswith('Data/') or name in forbidden_exact or any(name.endswith(s) for s in forbidden_suffixes):
                  failures.append(rel)
          if failures:
              raise SystemExit('Private runtime files detected: ' + ', '.join(failures))
          PY

      - name: Revalidate source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          python -m compileall -q .
          python -m pytest -q
          python tools/check_entrypoint_imports.py
          python -c "import content_agent.main"

      - name: Commit complete public source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release UA FREE Content Tool v1.0.0 source'
          git push origin main

      - name: Dispatch Windows build and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f version=1.0.0 -f prerelease=false; then
              exit 0
            fi
            sleep 10
          done
          echo 'Source was published, but release workflow dispatch failed.' >&2
          exit 1
