name: Deploy validated UA FREE Content Tool source

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-validated-v1.0.0
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == '__DEPLOY_UA_FREE_CONTENT_TOOL_V1_0_0__'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      EXPECTED_SHA256: a18f8833fa8c586974537d38d0484e922e42da9b95c001c6c8240df368f8e825
      EXPECTED_SIZE: '294609'

    steps:
      - name: Deploy exact validated repository package through Git Data API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          import stat
          import time
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import PurePosixPath

          token = os.environ['GH_TOKEN']
          repository = os.environ['GH_REPOSITORY']
          expected_sha = os.environ['EXPECTED_SHA256']
          expected_size = int(os.environ['EXPECTED_SIZE'])
          api = f'https://api.github.com/repos/{repository}'

          def request(method: str, path: str, payload=None):
              url = path if path.startswith('https://') else api + path
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'ua-free-content-tool-bootstrap',
                      'Content-Type': 'application/json',
                  },
              )
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode('utf-8', errors='replace')
                      if exc.code in {429, 500, 502, 503, 504} and attempt < 5:
                          time.sleep(2 ** attempt)
                          continue
                      raise RuntimeError(f'{method} {url} failed: HTTP {exc.code}: {body}') from exc

          encoded_file = request('GET', '/contents/.bootstrap/package.b64.00?ref=main')
          if encoded_file.get('encoding') != 'base64':
              raise SystemExit('Unexpected GitHub contents encoding')
          b64_text = base64.b64decode(encoded_file['content']).decode('ascii')
          package = base64.b64decode(''.join(b64_text.split()), validate=True)

          if len(package) != expected_size:
              raise SystemExit(f'Package size mismatch: {len(package)} != {expected_size}')
          digest = hashlib.sha256(package).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f'Package SHA-256 mismatch: {digest} != {expected_sha}')

          files: list[tuple[str, bytes]] = []
          with zipfile.ZipFile(io.BytesIO(package)) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'ZIP CRC failed: {bad}')
              infos = archive.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate ZIP member names detected')
              roots = {name.split('/', 1)[0] for name in names if name}
              if roots != {'ua-free-content-tool'}:
                  raise SystemExit(f'Unexpected canonical root: {sorted(roots)}')
              for info in infos:
                  name = info.filename
                  pure = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if name.startswith(('/', '\\')) or '\\' in name or '..' in pure.parts:
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Symlink is not allowed: {name}')
                  if info.is_dir():
                      continue
                  relative = pure.relative_to('ua-free-content-tool').as_posix()
                  files.append((relative, archive.read(info)))

          if len(files) != 123:
              raise SystemExit(f'Unexpected file count: {len(files)} != 123')
          required = {
              'content_agent/main.py',
              'content_agent/ui/main_window.py',
              'tests/test_r8_fix30.py',
              'requirements.txt',
              'FILE_MANIFEST.sha256',
              'README.md',
              '.github/workflows/release.yml',
          }
          actual_names = {name for name, _ in files}
          missing = sorted(required - actual_names)
          if missing:
              raise SystemExit(f'Required files missing from package: {missing}')

          tree = []
          for index, (path, content) in enumerate(files, start=1):
              blob = request(
                  'POST',
                  '/git/blobs',
                  {
                      'content': base64.b64encode(content).decode('ascii'),
                      'encoding': 'base64',
                  },
              )
              tree.append(
                  {
                      'path': path,
                      'mode': '100755' if path.endswith('.bat') else '100644',
                      'type': 'blob',
                      'sha': blob['sha'],
                  }
              )
              if index % 20 == 0 or index == len(files):
                  print(f'Created {index}/{len(files)} blobs')

          tree_result = request('POST', '/git/trees', {'tree': tree})
          current_ref = request('GET', '/git/ref/heads/main')
          parent = current_ref['object']['sha']
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'Deploy complete UA FREE Content Tool v1.0.0 source',
                  'tree': tree_result['sha'],
                  'parents': [parent],
              },
          )
          request('PATCH', '/git/refs/heads/main', {'sha': commit['sha'], 'force': False})
          print(f"DEPLOYED_COMMIT={commit['sha']}")
          print(f"DEPLOYED_FILES={len(files)}")
          print(f"PACKAGE_SHA256={digest}")

          issue = os.environ.get('GITHUB_EVENT_PATH')
          if issue:
              try:
                  event = json.loads(open(issue, encoding='utf-8').read())
                  number = event.get('issue', {}).get('number')
                  if number:
                      request(
                          'PATCH',
                          f'/issues/{number}',
                          {
                              'state': 'closed',
                              'state_reason': 'completed',
                              'body': (
                                  'One-time deployment trigger. The validated v1.0.0 source tree '
                                  f'was deployed as commit `{commit["sha"]}`.'
                              ),
                          },
                      )
              except Exception as exc:
                  print(f'Could not close trigger issue: {exc}')
          PY
