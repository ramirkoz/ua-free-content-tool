name: Deploy validated UA FREE Content Tool source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-validated-v1.0.0
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PACKAGE_B64: .bootstrap/package.b64.00
      PACKAGE_ZIP: /tmp/ua-free-content-tool-repository-package.zip
      PACKAGE_SHA256: a18f8833fa8c586974537d38d0484e922e42da9b95c001c6c8240df368f8e825
      PACKAGE_SIZE: '294609'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout transport commit
        uses: actions/checkout@v4

      - name: Reconstruct and verify validated package
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PACKAGE_B64"
          tr -d '\r\n\t ' < "$PACKAGE_B64" | base64 --decode > "$PACKAGE_ZIP"
          test "$(stat -c '%s' "$PACKAGE_ZIP")" = "$PACKAGE_SIZE"
          echo "$PACKAGE_SHA256  $PACKAGE_ZIP" | sha256sum -c -

      - name: Validate ZIP structure and extract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ua-free-content-tool-package
          mkdir -p /tmp/ua-free-content-tool-package
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path('/tmp/ua-free-content-tool-repository-package.zip')
          destination = Path('/tmp/ua-free-content-tool-package')

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              if zf.testzip() is not None:
                  raise SystemExit('ZIP CRC validation failed')
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate ZIP member names detected')
              roots = {name.split('/', 1)[0] for name in names if name}
              if roots != {'ua-free-content-tool'}:
                  raise SystemExit(f'Unexpected canonical root: {sorted(roots)}')
              for info in zf.infolist():
                  name = info.filename
                  path = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if name.startswith(('/', '\\')) or '\\' in name or '..' in path.parts:
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Symlink is not allowed: {name}')
              zf.extractall(destination)
          PY
          test -f /tmp/ua-free-content-tool-package/ua-free-content-tool/content_agent/main.py
          test -f /tmp/ua-free-content-tool-package/ua-free-content-tool/tests/test_r8_fix30.py
          test -f /tmp/ua-free-content-tool-package/ua-free-content-tool/FILE_MANIFEST.sha256

      - name: Replace repository with exact validated source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' \
            /tmp/ua-free-content-tool-package/ua-free-content-tool/ ./

      - name: Verify manifest and public-source boundaries
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c FILE_MANIFEST.sha256
          python - <<'PY'
          from pathlib import Path

          forbidden_exact = {
              'config.portable', 'portable.key', 'content_agent.sqlite3',
              'instance.lock', '.env'
          }
          forbidden_suffixes = {
              '.db', '.sqlite', '.sqlite3', '.sqlite3-wal', '.sqlite3-shm',
              '.log', '.token', '.secret', '.pem', '.p12', '.pfx', '.pyc'
          }
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix()
              name = path.name.lower()
              if rel.startswith('Data/') or '__pycache__' in path.parts or '.pytest_cache' in path.parts:
                  failures.append(rel)
              elif name in forbidden_exact or any(name.endswith(s) for s in forbidden_suffixes):
                  failures.append(rel)
          if failures:
              raise SystemExit('Forbidden runtime or cache files detected: ' + ', '.join(failures))
          PY

      - name: Revalidate source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          python -m compileall -q .
          python -m pytest -q
          python tools/check_entrypoint_imports.py
          python -c "import content_agent.main"

      - name: Commit complete product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Deploy complete UA FREE Content Tool v1.0.0 source'
          git push origin main

      - name: Dispatch Windows release build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f version=1.0.0 -f prerelease=false; then
              exit 0
            fi
            sleep 10
          done
          echo 'Complete source was published, but release workflow dispatch failed.' >&2
          exit 1
