name: Bootstrap public source repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PACKAGE_URL: https://filebin.net/uafree-content-tool-20260802-fix30-4f9c1ab7/UA_FREE_Content_Tool_v1.0.0_GitHub_Repository_Package.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and unpack validated repository package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 "$PACKAGE_URL" -o /tmp/repository-package.zip
          mkdir -p /tmp/repository-package
          unzip -q /tmp/repository-package.zip -d /tmp/repository-package
          ROOT="$(find /tmp/repository-package -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          test -f "$ROOT/README.md"
          test -f "$ROOT/content_agent/main.py"
          rsync -a --delete --exclude='.git/' "$ROOT/" ./

      - name: Install robust Windows release workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/release.yml <<'YAML'
          name: Build and publish Windows release

          on:
            workflow_dispatch:
              inputs:
                tag:
                  description: Release tag
                  required: true
                  default: v1.0.0

          permissions:
            contents: write

          jobs:
            release:
              runs-on: windows-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'

                - name: Build and test portable application
                  shell: cmd
                  run: Build_Portable_Windows.bat

                - name: Prepare release archives and checksums
                  shell: pwsh
                  run: |
                    $ErrorActionPreference = 'Stop'
                    $tag = '${{ inputs.tag }}'
                    $exe = Get-ChildItem -Path Release -Recurse -Filter UA_FREE_Content_Tool.exe | Select-Object -First 1
                    if (-not $exe) { throw 'Portable EXE was not found under Release.' }
                    $portableDir = $exe.Directory.FullName
                    $portableZip = "UA_FREE_Content_Tool_Windows_Portable_$tag.zip"
                    $sourceZip = "UA_FREE_Content_Tool_Source_$tag.zip"
                    Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $portableZip -Force
                    git archive --format=zip --output=$sourceZip HEAD
                    $hashes = foreach ($file in @($portableZip, $sourceZip)) {
                      $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
                      "$hash  $file"
                    }
                    $hashes | Set-Content -Encoding ascii SHA256SUMS.txt

                - name: Publish GitHub Release
                  shell: pwsh
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    gh release create '${{ inputs.tag }}' `
                      UA_FREE_Content_Tool_Windows_Portable_${{ inputs.tag }}.zip `
                      UA_FREE_Content_Tool_Source_${{ inputs.tag }}.zip `
                      SHA256SUMS.txt `
                      --target '${{ github.sha }}' `
                      --title 'UA FREE Content Tool ${{ inputs.tag }}' `
                      --notes-file docs/RELEASE_v1.0.0.md `
                      --latest
          YAML

      - name: Verify that private runtime data is absent
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(Data|config\.portable|portable\.key|content_agent\.sqlite3|instance\.lock)$|\.(db|sqlite|sqlite3)$'
          if git ls-files --others --cached --exclude-standard | grep -E "$forbidden"; then
            echo 'Private runtime material detected.' >&2
            exit 1
          fi

      - name: Commit public release source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release UA FREE Content Tool v1.0.0'
          git push origin main

      - name: Start Windows release build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run release.yml --ref main -f tag=v1.0.0; then
              exit 0
            fi
            sleep 10
          done
          echo 'Source was published, but automatic release dispatch did not start.' >&2
          exit 1
