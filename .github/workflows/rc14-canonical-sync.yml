name: RC14 canonical sync apply

on:
  push:
    branches: [release/rc14-anti-slop-auto-update]
    paths:
      - .sync/rc14_delta.zip
      - .github/workflows/rc14-canonical-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact RC14 delta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $size = (Get-Item ".sync/rc14_delta.zip").Length
          if ($size -ne 18926) { throw "Unexpected delta size: $size" }
          $hash = (Get-FileHash ".sync/rc14_delta.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c2bbbd26d132f759eb5a0048301f49a9a1be4e596bfab66dc9b65f860a8f2a76") { throw "Delta SHA mismatch: $hash" }

      - name: Apply RC14 delta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive ".sync/rc14_delta.zip" -DestinationPath ".rc14_apply" -Force
          Get-ChildItem ".rc14_apply" -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path ".rc14_apply").Path.Length + 1)
            $dest = Join-Path (Resolve-Path ".").Path $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item $_.FullName $dest -Force
          }
          Remove-Item ".rc14_apply" -Recurse -Force
          Remove-Item ".sync" -Recurse -Force
          Remove-Item ".github/workflows/rc14-canonical-sync.yml" -Force

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }

      - name: Compile
        run: python -m compileall -q content_agent tests

      - name: Full regression suite
        run: python -m pytest -q

      - name: Entrypoint imports
        run: python tools/check_entrypoint_imports.py

      - name: Import application
        run: python -c "import content_agent.main"

      - name: RC14 architecture gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-Content VERSION.txt -Raw).Trim() -ne "2.0.0-rc14") { throw "VERSION mismatch" }
          if ((Get-Content PUBLIC_VERSION.txt -Raw).Trim() -ne "2.0.0-rc14") { throw "PUBLIC_VERSION mismatch" }
          $slop = Get-Content "content_agent/anti_slop.py" -Raw
          $rewrite = Get-Content "content_agent/rewrite_pipeline_v1_4_rc27.py" -Raw
          $auto = Get-Content "content_agent/v2/supervisor/auto_update.py" -Raw
          $runtime = Get-Content "content_agent/v2/supervisor/resilient_runtime.py" -Raw
          if (-not $slop.Contains("assess_ukrainian_slop")) { throw "Anti-Slop engine missing" }
          if (-not $rewrite.Contains("UA Anti-Slop")) { throw "Anti-Slop not wired after Fact Guard" }
          if (-not $auto.Contains("github-release-auto")) { throw "Autonomous updater mode missing" }
          if (-not $auto.Contains("UA_FREE_Content_Tool_v")) { throw "Pinned release asset contract missing" }
          if (-not $runtime.Contains("AutonomousUpdateManager")) { throw "Autonomous updater not wired into Supervisor" }
          if (-not $runtime.Contains("self.control.execute_update(command)")) { throw "Existing rollback-safe updater not reused" }
          Write-Host "RC14_ARCHITECTURE_OK"

      - name: Commit clean canonical RC14
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "RC14: UA Anti-Slop v1 and autonomous safe updater"
          git push origin HEAD:release/rc14-anti-slop-auto-update
