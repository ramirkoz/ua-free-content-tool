name: Finalize v1.1.0 automation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v1-1-automation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Disable automatic republishing and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          publish = Path('.github/workflows/publish-v1-1-0.yml')
          text = publish.read_text(encoding='utf-8')
          old = "on:\n  push:\n    branches: [main]\n  workflow_dispatch:\n"
          new = "on:\n  workflow_dispatch:\n"
          if old not in text:
              raise SystemExit('automatic publish trigger anchor not found')
          text = text.replace(old, new, 1)
          old_if = "    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}\n"
          if old_if not in text:
              raise SystemExit('publish job condition anchor not found')
          text = text.replace(old_if, "", 1)
          publish.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/finalize-v1-1-automation.yml

      - name: Refresh final repository manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path.cwd()
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'FILE_MANIFEST.sha256':
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")
          (root / 'FILE_MANIFEST.sha256').write_text(
              '\n'.join(lines) + '\n', encoding='ascii', newline='\n'
          )
          PY

      - name: Commit final automation state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v1.1.0 release automation [skip release]"
          git push origin HEAD:main
