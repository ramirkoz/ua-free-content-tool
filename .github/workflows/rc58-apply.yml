import inspect
from pathlib import Path

import pytest

from content_agent.media_gallery_v1_2_rc4 import VideoGalleryPayload
from content_agent.models import MediaPayload
from content_agent.multi_image_store_v1_2_rc4 import MultiImageStore, MultiImageStoreError, StoredImageAttachment
from content_agent.publisher_factory_rc58 import _FirstVideoOnlyPublisher
from content_agent.telegram_media_v1_3_rc6 import _TelegramPostMediaParser
from content_agent.telegram_video_album_rc58 import _video_album_body
from content_agent.v2.ui.manual_topics_window_rc44 import MainWindow


def _media(name: str) -> MediaPayload:
    return MediaPayload(name, name, "video", "video/mp4", b"video", "")


def test_rc58_store_opt_in_accepts_video_sets_but_legacy_default_rejects(tmp_path: Path):
    item = StoredImageAttachment("v1", "v1.mp4", "video/mp4", 5, "")
    with pytest.raises(MultiImageStoreError):
        MultiImageStore(tmp_path / "legacy.json").set_group(1, [item])
    store = MultiImageStore(tmp_path / "media.json", allow_video=True)
    store.set_group(1, [item])
    assert store.list_group(1)[0].mime_type == "video/mp4"


def test_rc58_video_gallery_is_2_to_10_videos():
    gallery = VideoGalleryPayload([_media("1"), _media("2")])
    assert gallery.first.name == "1"
    assert gallery.kind == "video"


def test_rc58_telegram_video_album_contains_every_selected_video():
    body, content_type = _video_album_body("chat", "caption", VideoGalleryPayload([_media("1"), _media("2"), _media("3")]))
    assert b'attach://video0' in body and b'attach://video1' in body and b'attach://video2' in body
    assert b'"type":"video"' in body
    assert content_type.startswith("multipart/form-data; boundary=")


def test_rc58_other_platforms_receive_only_first_video():
    calls = []
    class Delegate:
        def publish(self, text, progress, context, media=None):
            calls.append(media)
            return "ok"
    wrapped = _FirstVideoOnlyPublisher(Delegate())
    gallery = VideoGalleryPayload([_media("1"), _media("2")])
    assert wrapped.publish("x", {}, None, gallery) == "ok"
    assert calls == [gallery.first]


def test_rc58_telegram_parser_collects_all_grouped_player_pages():
    html = '''<div class="tgme_widget_message_grouped"><a class="tgme_widget_message_video_player" href="https://telesco.pe/file/a"></a><a class="tgme_widget_message_video_player" href="https://telesco.pe/file/b"></a></div>'''
    parser = _TelegramPostMediaParser("https://t.me/x/1?embed=1", "x")
    parser.feed(html)
    assert parser.player_pages == ["https://telesco.pe/file/a", "https://telesco.pe/file/b"]


def test_rc58_media_progress_is_busy_only():
    source = inspect.getsource(MainWindow)
    assert "progress.grid_remove()" in source
    assert "progress.grid()" in source
    assert "progress.start(10)" in source


