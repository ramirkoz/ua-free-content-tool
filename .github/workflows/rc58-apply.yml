          Path('content_agent/telegram_video_album_rc58.py').write_text(r'''from __future__ import annotations

import json
import secrets

from .comment_compat_v1_2_rc3 import CompatibleTelegramPublisher
from .media_gallery_v1_2_rc4 import VideoGalleryPayload
from .network import NetworkError, fetch_url
from .publication_text import telegram_split
from .publishers import PublishContext, PublishError, PublishResult, _check_payload, _post_form


def _video_album_body(chat_id: str, caption: str, gallery: VideoGalleryPayload) -> tuple[bytes, str]:
    boundary = "----UAFreeVideoAlbum" + secrets.token_hex(16)
    media_rows = []
    for index, item in enumerate(gallery.items):
        row = {"type": "video", "media": f"attach://video{index}"}
        if index == 0 and caption:
            row["caption"] = caption
        media_rows.append(row)
    chunks: list[bytes] = []
    for key, value in {"chat_id": chat_id, "media": json.dumps(media_rows, ensure_ascii=False, separators=(",", ":"))}.items():
        chunks.extend([f"--{boundary}\r\n".encode(), f'Content-Disposition: form-data; name="{key}"\r\n\r\n'.encode(), str(value).encode('utf-8'), b"\r\n"])
    for index, item in enumerate(gallery.items):
        safe_name = item.name.replace('"', '_').replace('\r', '_').replace('\n', '_')
        chunks.extend([
            f"--{boundary}\r\n".encode(),
            f'Content-Disposition: form-data; name="video{index}"; filename="{safe_name}"\r\n'.encode('utf-8'),
            f"Content-Type: {item.mime_type}\r\n\r\n".encode(), item.data, b"\r\n",
        ])
    chunks.append(f"--{boundary}--\r\n".encode())
    return b"".join(chunks), f"multipart/form-data; boundary={boundary}"


def _send_video_album(token: str, chat_id: str, caption: str, gallery: VideoGalleryPayload) -> list[str]:
    body, content_type = _video_album_body(chat_id, caption, gallery)
    response = fetch_url(
        f"https://api.telegram.org/bot{token}/sendMediaGroup",
        method="POST",
        headers={"Content-Type": content_type, "Accept": "application/json"},
        body=body,
        max_bytes=4 * 1024 * 1024,
        allowed_content_types={"application/json", "text/javascript"},
        timeout=300,
        max_redirects=1,
        allow_http_errors=True,
    )
    payload = response.json() if response.body else {}
    if response.status >= 400:
        _check_payload(payload, http_status=response.status)
        raise PublishError(f"Telegram sendMediaGroup failed with HTTP {response.status}.", retryable=response.status == 429 or response.status >= 500, rate_limited=response.status == 429)
    checked = _check_payload(payload)
    result = checked.get("result")
    if not isinstance(result, list):
        raise PublishError("Telegram не повернув список повідомлень після відеокаруселі.", retryable=False, outcome_unknown=True)
    ids = [str(row.get("message_id")) for row in result if isinstance(row, dict) and row.get("message_id") not in (None, "")]
    if not ids:
        raise PublishError("Telegram не повернув message_id після відеокаруселі.", retryable=False, outcome_unknown=True)
    return ids


class Rc58TelegramPublisher(CompatibleTelegramPublisher):
    def publish(self, text: str, progress: dict[str, object], context: PublishContext, media=None) -> PublishResult:
        if not isinstance(media, VideoGalleryPayload):
            return super().publish(text, progress, context, media)
        remote_ids = list(progress.get("telegram_video_album_remote_ids") or [])
        if bool(progress.get("telegram_video_album_completed")) and remote_ids:
            return PublishResult(remote_id=str(remote_ids[0]), progress=progress)
        if bool(progress.get("telegram_video_album_started")):
            raise PublishError("Telegram: результат попередньої відеокаруселі невідомий; автоматичний повтор заблоковано.", retryable=False, outcome_unknown=True)
        caption = text if len(text) <= 1024 else ""
        progress = {**progress, "telegram_video_album_started": True, "telegram_video_album_completed": False}
        context.save_progress(progress)
        context.before_write()
        try:
            remote_ids = _send_video_album(self.token, self.chat_id, caption, media)
        except PublishError as exc:
            if not exc.retryable and not exc.outcome_unknown:
                context.save_progress({**progress, "telegram_video_album_started": False})
                raise
            raise PublishError("Telegram: результат публікації відеокаруселі невідомий; автоматичний повтор заблоковано.", retryable=False, outcome_unknown=True) from exc
        except NetworkError as exc:
            raise PublishError("Telegram: з'єднання перервалося під час відеокаруселі; результат невідомий.", retryable=False, outcome_unknown=True) from exc
        progress = {**progress, "telegram_video_album_started": False, "telegram_video_album_completed": True, "telegram_video_album_remote_ids": remote_ids}
        context.save_progress(progress)
        if not caption and text:
            parts = telegram_split(text)
            for index, part in enumerate(parts):
                context.before_write()
                result = _post_form(f"https://api.telegram.org/bot{self.token}/sendMessage", {"chat_id": self.chat_id, "text": part, "disable_web_page_preview": "false"})
                if result.get("ok") is not True:
                    raise PublishError(str(result.get("description", "Telegram rejected the text after video album.")))
        return PublishResult(remote_id=remote_ids[0], progress=progress)
''', encoding='utf-8')

