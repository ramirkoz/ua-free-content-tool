name: RC58 apply media fixes

on:
  push:
    branches: [rc58-telegram-video-carousel]
    paths:
      - '.github/workflows/rc58-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc58-telegram-video-carousel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply RC58 focused media fixes
        run: python .github/rc58_apply.py
      - name: Commit applied RC58
        shell: bash
        run: |
          git config user.name "Tony"
          git config user.email "ramirua.fm@gmail.com"
          git add -A
          git commit -m "RC58 Telegram video carousel and busy media progress [rc58-applied]"
          git push origin HEAD:rc58-telegram-video-carousel
