name: KONTUR RC46 Temporary Public Transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kontur-rc46-public-transfer.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify RC46
        shell: bash
        run: |
          set -euo pipefail
          url='https://tempfile.org/9Hbds8CmDKE/download'
          expected_size=44447438
          rm -f rc46.zip
          ok=0
          for attempt in $(seq 1 12); do
            echo "download attempt ${attempt}"
            curl -fL --connect-timeout 20 --max-time 600 --retry 2 --retry-all-errors --retry-delay 2 -C - "$url" -o rc46.zip && ok=1 || true
            size=$(stat -c%s rc46.zip 2>/dev/null || echo 0)
            echo "downloaded=${size}/${expected_size}"
            if [ "$size" -eq "$expected_size" ]; then
              ok=1
              break
            fi
            if [ "$size" -gt "$expected_size" ]; then
              echo "oversized partial file; restarting"
              rm -f rc46.zip
            fi
            sleep 2
          done
          test "$ok" -eq 1
          test "$(stat -c%s rc46.zip)" -eq "$expected_size"
          echo 'e0ba9ed9abacc54e62912956a20985b8f2d913331615b534457bc66d4688d246  rc46.zip' | sha256sum -c -
          rm -rf payload
          mkdir payload
          unzip -q rc46.zip -d payload
          test -f payload/KONTUR_RF.exe
          test -f payload/KONTUR_UpdateWatch_RC26.exe
          test -f payload/KONTUR_TransactionRunner_RC26.exe
      - name: Upload updater-ready artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: KONTUR_RC46_DRIVE_BRIDGE
          path: payload/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Print artifact digest
        shell: bash
        run: echo "RC46_ARTIFACT_SHA256=${{ steps.upload.outputs.artifact-digest }}"
