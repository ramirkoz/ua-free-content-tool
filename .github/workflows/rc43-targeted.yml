name: RC43 manual source topics regression gate

on:
  pull_request:
    branches: [main]
    paths:
      - content_agent/v2/storage/manual_topics.py
      - content_agent/v2/storage/reliable.py
      - content_agent/v2/ui/manual_topics_window.py
      - content_agent/v2/ui/manual_topics_window_rc44.py
      - content_agent/clean_import.py
      - tests/test_rc43_manual_source_topics.py
      - .github/workflows/rc43-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-regressions:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile manual topic code
        shell: pwsh
        run: python -m compileall -q content_agent/v2/storage content_agent/v2/ui tests/test_rc43_manual_source_topics.py
      - name: Manual source topic regressions
        shell: pwsh
        run: python -m pytest -q tests/test_rc43_manual_source_topics.py
      - name: Manual topic storage contract remains available
        shell: pwsh
        run: |
          python -c "from content_agent.v2.storage.reliable import Database; assert hasattr(Database, 'set_source_topic'); assert hasattr(Database, 'list_manual_topics')"
