name: RC43 focused manual source topics gate

on:
  push:
    branches: [rc43-manual-source-topics]
  pull_request:
    branches: [main]
    paths:
      - content_agent/v2/storage/manual_topics.py
      - content_agent/v2/storage/reliable.py
      - content_agent/v2/ui/manual_topics_window.py
      - content_agent/main.py
      - content_agent/clean_import.py
      - tests/test_rc43_manual_source_topics.py
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - content_agent/__init__.py
      - RELEASE_NOTES_v2.0.0-rc43.md
      - .github/workflows/rc43-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application
        shell: pwsh
        run: python -m compileall -q content_agent tests/test_rc43_manual_source_topics.py
      - name: Manual source topic regressions
        shell: pwsh
        run: python -m pytest -q tests/test_rc43_manual_source_topics.py
      - name: Active V2 entrypoint uses RC43 topic window
        shell: pwsh
        run: |
          python -c "from content_agent.main import MainWindow; assert MainWindow.__module__ == 'content_agent.v2.ui.manual_topics_window'; from content_agent.v2.storage.reliable import Database; assert hasattr(Database, 'set_source_topic')"
      - name: Keep RC42 Instagram multi-account regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
      - name: Keep RC41 Drive auth regressions green
        shell: pwsh
        run: python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc43') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC43.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc43_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc43_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC43.txt
          if-no-files-found: error
