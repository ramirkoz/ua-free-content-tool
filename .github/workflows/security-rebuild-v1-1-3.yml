name: Security rebuild v1.1.3

on:
  push:
    branches: [feature/v1.1.3-security-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.1.3-security-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Validate source
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q
          python tools/check_entrypoint_imports.py
          python -c "import content_agent.main"
      - name: Build signed Python runtime
        shell: pwsh
        run: ./tools/build_signed_python_runtime.ps1
      - name: Validate signature and isolated runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "Release\UA_FREE_Content_Tool_v1.1.3\UA_FREE_Content_Tool"
          $exe = Join-Path $root "UA_FREE_Content_Tool.exe"
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid") { throw "Invalid launcher signature: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch "Python Software Foundation") {
            throw "Unexpected signer: $($sig.SignerCertificate.Subject)"
          }
          if (-not (Test-Path (Join-Path $root "python312._pth"))) { throw "Isolated runtime file missing" }
          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Portable application exited during startup smoke test: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          if (-not (Test-Path (Join-Path $root "Data\content_agent.sqlite3"))) {
            throw "Portable startup did not create its local database"
          }
      - name: Microsoft Defender custom scan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v1.1.3\UA_FREE_Content_Tool").Path
          $platform = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $platform) { throw "Microsoft Defender command-line scanner is unavailable on the build runner" }
          & $platform.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender signature update failed: $LASTEXITCODE" }
          & $platform.FullName -Scan -ScanType 3 -File $root -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender detected or could not scan the runtime: $LASTEXITCODE" }
      - name: Remove smoke-test data and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "Release\UA_FREE_Content_Tool_v1.1.3\UA_FREE_Content_Tool"
          Remove-Item "$root\Data\*" -Recurse -Force -ErrorAction SilentlyContinue
          $zip = "UA_FREE_Content_Tool_v1.1.3_Windows_Portable_SECURITY_RC.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "SHA256SUMS_v1.1.3_SECURITY_RC.txt" -Encoding ascii
          Write-Host "SECURITY_RC_SHA256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v1.1.3_SECURITY_RC
          path: |
            UA_FREE_Content_Tool_v1.1.3_Windows_Portable_SECURITY_RC.zip
            SHA256SUMS_v1.1.3_SECURITY_RC.txt
          retention-days: 14
