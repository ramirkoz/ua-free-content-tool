name: Security rebuild v1.1.3

on:
  push:
    branches: [feature/v1.1.3-security-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.1.3-security-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed: $LASTEXITCODE" }
      - name: Validate source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed: $LASTEXITCODE" }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Automated tests failed: $LASTEXITCODE" }
          python tools/check_entrypoint_imports.py
          if ($LASTEXITCODE -ne 0) { throw "Entrypoint validation failed: $LASTEXITCODE" }
          python -c "import content_agent.main"
          if ($LASTEXITCODE -ne 0) { throw "Application import failed: $LASTEXITCODE" }
      - name: Build signed Python runtime
        shell: pwsh
        run: ./tools/build_signed_python_runtime.ps1
      - name: Validate signature and isolated runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v1.1.3\UA_FREE_Content_Tool").Path
          $exe = (Resolve-Path (Join-Path $root "UA_FREE_Content_Tool.exe")).Path
          $console = (Resolve-Path (Join-Path $root "_runtime_console.exe")).Path
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid") { throw "Invalid launcher signature: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch "Python Software Foundation") {
            throw "Unexpected signer: $($sig.SignerCertificate.Subject)"
          }
          foreach ($pth in @("python312._pth", "UA_FREE_Content_Tool._pth", "_runtime_console._pth")) {
            if (-not (Test-Path (Join-Path $root $pth))) { throw "Isolated runtime file missing: $pth" }
          }
          Push-Location $root
          try {
            & $console -I -c "import sys; print(sys.executable); import content_agent.main; print('APP_IMPORT_OK')"
            if ($LASTEXITCODE -ne 0) { throw "Isolated application import failed: $LASTEXITCODE" }
            & $console -I -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy(); print('TK_OK')"
            if ($LASTEXITCODE -ne 0) { throw "Isolated Tk runtime failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            Write-Host "--- Portable Data files ---"
            Get-ChildItem (Join-Path $root "Data") -Recurse -Force -ErrorAction SilentlyContinue | Format-List FullName,Length
            Write-Host "--- Portable logs ---"
            Get-ChildItem (Join-Path $root "Data\logs") -File -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "### $($_.FullName)"; Get-Content $_.FullName -Raw }
            throw "Portable application exited during startup smoke test: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          if (-not (Test-Path (Join-Path $root "Data\content_agent.sqlite3"))) {
            throw "Portable startup did not create its local database"
          }
          Remove-Item $console -Force
          Remove-Item (Join-Path $root "_runtime_console._pth") -Force
      - name: Microsoft Defender custom scan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "Release\UA_FREE_Content_Tool_v1.1.3\UA_FREE_Content_Tool").Path
          $platform = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $platform) { throw "Microsoft Defender command-line scanner is unavailable on the build runner" }
          & $platform.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender signature update failed: $LASTEXITCODE" }
          & $platform.FullName -Scan -ScanType 3 -File $root -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender detected or could not scan the runtime: $LASTEXITCODE" }
      - name: Remove smoke-test data, validate, scan, and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "Release\UA_FREE_Content_Tool_v1.1.3\UA_FREE_Content_Tool"
          Remove-Item "$root\Data\*" -Recurse -Force -ErrorAction SilentlyContinue
          $zip = "UA_FREE_Content_Tool_v1.1.3_Windows_Portable_SECURITY_RC.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal

          @'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert z.testzip() is None, "CRC validation failed"
              assert len(names) == len(set(names)), "duplicate ZIP paths"
              assert not any("\\" in name for name in names), "backslash ZIP path"
              assert not any(name.startswith(("/", "\\")) or "../" in name.replace("\\", "/") for name in names), "unsafe ZIP path"
              exes = [name for name in names if name.casefold().endswith(".exe")]
              assert exes == ["UA_FREE_Content_Tool.exe"], f"unexpected executables: {exes}"
              assert not any("_runtime_console" in name.casefold() for name in names), "diagnostic runtime shipped"
              assert not any(name.casefold().endswith((".sqlite3", ".db", ".log", ".env", ".wal", ".shm")) for name in names), "runtime data shipped"
              assert z.read("PUBLIC_VERSION.txt").decode("utf-8").strip() == "1.1.3"
              assert z.read("VERSION.txt").decode("utf-8").strip() == "1.1.3"
          print("SECURITY_RC_ZIP_VALIDATION_OK")
          '@ | Set-Content validate_security_rc.py -Encoding utf8
          python validate_security_rc.py $zip
          if ($LASTEXITCODE -ne 0) { throw "Security RC ZIP validation failed: $LASTEXITCODE" }
          Remove-Item validate_security_rc.py

          $platform = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $platform.FullName -Scan -ScanType 3 -File (Resolve-Path $zip).Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender detected or could not scan the security RC ZIP: $LASTEXITCODE" }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "SHA256SUMS_v1.1.3_SECURITY_RC.txt" -Encoding ascii
          Write-Host "SECURITY_RC_SHA256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v1.1.3_SECURITY_RC
          path: |
            UA_FREE_Content_Tool_v1.1.3_Windows_Portable_SECURITY_RC.zip
            SHA256SUMS_v1.1.3_SECURITY_RC.txt
          retention-days: 14
