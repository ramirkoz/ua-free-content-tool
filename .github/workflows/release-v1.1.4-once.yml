name: Dispatch UA FREE Content Tool v1.1.4 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.1.4-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected v1.1.4 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repository}/actions/workflows/release.yml/dispatches'
          body = json.dumps({
              'ref': 'main',
              'inputs': {
                  'version': '1.1.4',
                  'prerelease': 'false',
              },
          }).encode('utf-8')
          request = urllib.request.Request(
              url,
              data=body,
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ua-free-content-tool-v1.1.4-dispatcher',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(f'Unexpected dispatch status: {response.status}')
          print('RELEASE_V1_1_4_DISPATCHED=true')
          PY
