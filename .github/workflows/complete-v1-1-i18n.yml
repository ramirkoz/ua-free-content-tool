name: Complete v1.1.0 localization

on:
  push:
    branches:
      - feature/v1.1.0-bilingual-learning-inbox
    paths:
      - tools/prepare_v1_1_i18n_completion.py
      - tools/prepare_v1_1_i18n_compat.py
      - tools/apply_v1_1_i18n_completion.py
      - content_agent/i18n_extra.py
      - .github/workflows/complete-v1-1-i18n.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/prepare_v1_1_i18n_completion.py
      - tools/prepare_v1_1_i18n_compat.py
      - tools/apply_v1_1_i18n_completion.py
      - content_agent/i18n_extra.py
      - .github/workflows/complete-v1-1-i18n.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.1.0-bilingual-learning-inbox
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Prepare localization migration
        run: python tools/prepare_v1_1_i18n_completion.py
      - name: Preserve legacy UI compatibility
        run: python tools/prepare_v1_1_i18n_compat.py
      - name: Apply localization completion
        run: python tools/apply_v1_1_i18n_completion.py
      - name: Compile
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
      - name: Audit visible UI literals
        run: python tools/audit_v1_1_i18n.py
      - name: Verify entrypoints
        run: python tools/check_entrypoint_imports.py
      - name: Import application
        run: python -c "import content_agent.main"
      - name: Commit validated localization
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch tools/audit_v1_1_i18n.py
          git rm --ignore-unmatch .github/workflows/audit-v1-1-i18n.yml
          git rm --ignore-unmatch .github/workflows/complete-v1-1-i18n.yml
          git add -A
          git commit -m "Complete bilingual interface and prompts v1.1.0 [skip ci]"
          git push origin HEAD:feature/v1.1.0-bilingual-learning-inbox
