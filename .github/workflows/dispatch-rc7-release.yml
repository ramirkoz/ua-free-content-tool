name: Dispatch RC7 release once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-rc7-release.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Remove dispatcher and start clean prerelease build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/dispatch-rc7-release.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='Remove one-time RC7 release dispatcher' \
            -f sha="$sha" \
            -f branch=main >/dev/null
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version=1.3.1-rc7 \
            -f prerelease=true
          echo 'RC7 release workflow dispatched from clean main.'
