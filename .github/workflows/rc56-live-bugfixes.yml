name: RC56 live bugfix gate

on:
  push:
    branches: [rc56-live-bugfixes]
  pull_request:
    branches: [main]
    paths:
      - content_agent/**
      - tests/**
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - RELEASE_NOTES_v2.0.0-rc56.md
      - .github/workflows/rc56-live-bugfixes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
      - name: Compile application and tests
        shell: pwsh
        run: python -m compileall -q content_agent tests
      - name: RC56 live bugfix contracts
        shell: pwsh
        run: python -m pytest -q tests/test_rc56_live_bugfixes.py
      - name: Keep RC55 final acceptance green
        shell: pwsh
        run: python -m pytest -q tests/test_rc55_final_acceptance.py
      - name: Keep RC54 through RC50 retained gates green
        shell: pwsh
        run: |
          python -m pytest -q tests/test_rc54_operator_ui_retention.py
          python -m pytest -q tests/test_rc53_inbox_controller.py
          python -m pytest -q tests/test_rc52_publication_architecture.py tests/test_rc52_active_factory.py
          python -m pytest -q tests/test_rc51_ai_architecture.py
          python -m pytest -q tests/test_rc50_storage_contract.py
      - name: Keep RC49 through RC41 retained gates green
        shell: pwsh
        run: |
          python -m pytest -q tests/test_rc49_startup_contract.py tests/test_rc49_runtime_smoke.py
          python -m pytest -q tests/test_rc48_ux_reliability.py
          python -m pytest -q tests/test_rc47_composition_contracts.py
          python -m pytest -q tests/test_rc46_clean_import_wrapper.py
          python -m pytest -q tests/test_rc45_reliability.py
          python -m pytest -q tests/test_rc44_inbox_topic_filter.py tests/test_rc43_manual_source_topics.py
          python -m pytest -q tests/test_rc42_instagram_multi_ui.py tests/test_v1_4_destinations.py tests/test_v1_4_rc2_instagram.py
          python -m pytest -q tests/test_drive_auth_recovery_rc41.py tests/test_google_drive_r8.py
      - name: RC56 operator invariants
        shell: pwsh
        run: |
          if (Get-ChildItem content_agent -Recurse -File -Filter *window_rc56*.py) { throw "RC56 must not add another versioned window layer" }
          $shell = Get-Content content_agent/v2/ui/manual_topics_window_rc44.py -Raw
          if ($shell -notmatch '_replace_ollama_settings_panel' -or $shell -notmatch '_rc56_media_progress') { throw "RC56 canonical shell fixes missing" }
          $storage = Get-Content content_agent/v2/storage/manual_topics.py -Raw
          if ($storage -notmatch 'CASEFOLD' -or $storage -notmatch 'token.casefold') { throw "Unicode casefold search missing" }
          $tg = Get-Content content_agent/telegram_media_v1_3_rc6.py -Raw
          if ($tg -notmatch 'TELEGRAM_MEDIA_NOT_RESOLVED' -or $tg -notmatch 'range\(2\)') { throw "Telegram resolution diagnostics/retry missing" }
          $slop = Get-Content content_agent/anti_slop_rules_uk.json -Raw
          if ($slop -notmatch 'Розмита псевдоатрибуція') { throw "Anti-Slop vague attribution blocker missing" }
      - name: Full repository suite BLOCKING
        shell: pwsh
        run: python -m pytest -q
      - name: Build signed portable
        shell: cmd
        run: Build_Portable_Windows.bat
      - name: Package exact portable
        shell: pwsh
        run: |
          $version = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          if ($version -ne '2.0.0-rc56') { throw "unexpected version $version" }
          $root = "Release\UA_FREE_Content_Tool_v$version\UA_FREE_Content_Tool"
          if (-not (Test-Path "$root\UA_FREE_Content_Tool.exe")) { throw "portable exe missing" }
          $zip = "UA_FREE_Content_Tool_v${version}_Windows_Portable_MANUAL_TEST.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS_RC56.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Content_Tool_v2.0.0-rc56_Windows_Portable_MANUAL_TEST
          path: |
            UA_FREE_Content_Tool_v2.0.0-rc56_Windows_Portable_MANUAL_TEST.zip
            SHA256SUMS_RC56.txt
          if-no-files-found: error
