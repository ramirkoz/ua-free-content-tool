name: Build setup manuals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-manuals.yml
      - README.md
      - PLATFORM_SETUP.md
      - PORTABLE_MODE.md
      - SECURITY_NOTES.md
      - docs/manuals/README.md

permissions:
  contents: write

concurrency:
  group: build-setup-manuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            libreoffice-writer \
            fonts-noto-core \
            fonts-dejavu-core \
            poppler-utils
          python -m pip install --disable-pip-version-check python-docx

      - name: Prepare professional DOCX reference style
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ua-free-manuals"
          python - <<'PY'
          from docx import Document
          from docx.enum.section import WD_SECTION
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from docx.shared import Cm, Pt, RGBColor

          output = "${RUNNER_TEMP}/ua-free-manuals/reference.docx"
          doc = Document()
          section = doc.sections[0]
          section.page_width = Cm(21)
          section.page_height = Cm(29.7)
          section.top_margin = Cm(1.7)
          section.bottom_margin = Cm(1.6)
          section.left_margin = Cm(1.8)
          section.right_margin = Cm(1.6)

          styles = doc.styles
          normal = styles["Normal"]
          normal.font.name = "Noto Sans"
          normal._element.rPr.rFonts.set(qn("w:eastAsia"), "Noto Sans")
          normal.font.size = Pt(10)
          normal.paragraph_format.space_after = Pt(5)
          normal.paragraph_format.line_spacing = 1.08

          colors = {
              "Heading 1": (19, RGBColor(24, 65, 105)),
              "Heading 2": (14, RGBColor(32, 91, 132)),
              "Heading 3": (11, RGBColor(55, 71, 79)),
              "Title": (26, RGBColor(17, 58, 91)),
              "Subtitle": (13, RGBColor(69, 90, 100)),
          }
          for name, (size, color) in colors.items():
              style = styles[name]
              style.font.name = "Noto Sans"
              style._element.rPr.rFonts.set(qn("w:eastAsia"), "Noto Sans")
              style.font.size = Pt(size)
              style.font.color.rgb = color
              if name.startswith("Heading"):
                  style.font.bold = True
                  style.paragraph_format.keep_with_next = True
                  style.paragraph_format.space_before = Pt(12)
                  style.paragraph_format.space_after = Pt(5)

          code = styles["Verbatim Char"]
          code.font.name = "DejaVu Sans Mono"
          code._element.rPr.rFonts.set(qn("w:eastAsia"), "DejaVu Sans Mono")
          code.font.size = Pt(8.5)

          footer = section.footer.paragraphs[0]
          footer.alignment = WD_ALIGN_PARAGRAPH.CENTER
          run = footer.add_run("UA FREE Content Tool v1.0.0  •  ")
          run.font.name = "Noto Sans"
          run.font.size = Pt(8)
          run.font.color.rgb = RGBColor(90, 100, 110)
          begin = OxmlElement("w:fldChar")
          begin.set(qn("w:fldCharType"), "begin")
          instr = OxmlElement("w:instrText")
          instr.set(qn("xml:space"), "preserve")
          instr.text = " PAGE "
          separate = OxmlElement("w:fldChar")
          separate.set(qn("w:fldCharType"), "separate")
          end = OxmlElement("w:fldChar")
          end.set(qn("w:fldCharType"), "end")
          field_run = footer.add_run()
          field_run._r.extend([begin, instr, separate, end])

          doc.save(output)
          print(output)
          PY

      - name: Assemble complete English and Ukrainian manuals
        shell: bash
        env:
          UA_SOURCE_REF: 7f6cebbbd7d6346818b125838318a47cc227f960
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/ua-free-manuals"

          cat > "$BUILD/manual-en.md" <<'EOF'
          ---
          title: "UA FREE Content Tool"
          subtitle: "Complete Installation, Configuration, Operation, Backup, and Troubleshooting Manual"
          author: "UA FREE"
          date: "Version 1.0.0 / validated build R8 FIX30"
          lang: en-US
          ---

          ```{=openxml}
          <w:p><w:r><w:br w:type="page"/></w:r></w:p>
          ```

          # Document purpose and scope

          This manual is the complete operational reference for installing, configuring, validating, using, backing up, moving, and troubleshooting UA FREE Content Tool on Windows 10 or Windows 11. It is written for editors and administrators who may not be software developers.

          The application interface is Ukrainian. Important controls are therefore identified by both their Ukrainian label and their English meaning where this prevents ambiguity.

          > **Critical data-safety rule:** the working state is the complete portable application folder, especially its `Data` directory. Never update, move, or back up only the EXE. Never separate `Data/config.portable` from `Data/portable.key`.

          ## Recommended setup sequence

          1. Download the latest Windows portable ZIP and `SHA256SUMS.txt` from the GitHub Release.
          2. Verify SHA-256 before extraction.
          3. Extract the complete folder to a writable local location.
          4. Install and start Ollama, then download a compatible local model.
          5. Launch `UA_FREE_Content_Tool.exe` without administrator rights.
          6. Open **Налаштування** (Settings), select the Ollama model, and save.
          7. Configure only the social platforms you actually intend to publish to.
          8. Connect Google Drive when media publishing is required.
          9. Add and test sources.
          10. Run **Перевірити всі підключення зараз** (Check all connections now).
          11. Create a full-folder backup.
          12. Perform one controlled live publication and verify every platform result before enabling routine scheduling.

          ## What you need before configuration

          | Component | Required material |
          |---|---|
          | Windows | Windows 10/11 account with permission to write to the selected folder |
          | Ollama | Installed Ollama service and at least one local text model |
          | Facebook Pages | Meta App ID, App Secret, valid Facebook User Access Token, page role |
          | Threads | Threads access token with required scopes |
          | LinkedIn | Access token with `openid`, `profile`, and `w_member_social` |
          | Telegram | Bot token, channel username or ID, bot administrator role, `can_post_messages` |
          | Google Drive | Google Cloud Desktop OAuth Client ID and, when supplied, Client Secret |
          | Sources | RSS URL, website URL, or public Telegram channel identifier |

          # Part I — Product overview and complete operating workflow
          EOF
          tail -n +2 README.md >> "$BUILD/manual-en.md"

          cat >> "$BUILD/manual-en.md" <<'EOF'

          # Part II — Platform and Google Drive configuration
          EOF
          tail -n +2 PLATFORM_SETUP.md >> "$BUILD/manual-en.md"

          cat >> "$BUILD/manual-en.md" <<'EOF'

          # Part III — Portable data, migration, backups, and moving the application
          EOF
          tail -n +2 PORTABLE_MODE.md >> "$BUILD/manual-en.md"

          cat >> "$BUILD/manual-en.md" <<'EOF'

          # Part IV — Security policy and operational boundaries
          EOF
          tail -n +2 SECURITY_NOTES.md >> "$BUILD/manual-en.md"

          cat >> "$BUILD/manual-en.md" <<'EOF'

          # Part V — Detailed first-launch procedure

          ## 1. Verify the downloaded release

          Keep the portable ZIP and `SHA256SUMS.txt` in the same temporary folder. In PowerShell, run:

          ```powershell
          Get-FileHash .\UA_FREE_Content_Tool_v1.0.0_Windows_Portable.zip -Algorithm SHA256
          Get-Content .\SHA256SUMS.txt
          ```

          Compare the complete 64-character hash. Do not proceed when even one character differs.

          ## 2. Select a permanent folder

          Recommended examples are `C:\Tools\UA_FREE_Content_Tool` or a dedicated folder inside the current Windows user profile. Avoid running from inside the ZIP, a browser download preview, a read-only folder, or a location that is constantly synchronized while the database is open.

          ## 3. Confirm portable structure

          The extracted application folder must contain `UA_FREE_Content_Tool.exe`, `portable.flag`, documentation files, and a writable `Data` directory created or used beside the EXE. When moving the application, move this entire folder as one unit.

          ## 4. Configure Ollama

          Start Ollama before opening the application. Use `ollama list` to confirm that at least one model exists. In **Налаштування → 1. Ollama і моделі**, click **Знайти моделі** (Find models), select a primary model, optionally select a different fallback model, and click **ЗБЕРЕГТИ ЗМІНИ** (Save changes).

          A local loopback URL such as `http://127.0.0.1:11434` is expected. Remote or non-loopback Ollama addresses are intentionally rejected by the application security boundary.

          ## 5. Configure social integrations

          Complete one integration at a time. Enter credentials, use the platform-specific check button, read the returned status, then save. A platform that is not configured is simply unavailable as a publication target; it does not block the rest of the application.

          ## 6. Configure sources

          Open **Джерела** (Sources). Choose `rss`, `telegram`, or `url`, enter a human-readable source name, enter the address, and click **Додати** (Add). Test a small source set first. Enabled sources are checked after startup and every five minutes.

          ## 7. Validate the full chain

          Run all connection diagnostics, collect a small news sample, manually group related reports, create a local rewrite, attach a non-sensitive test image when needed, schedule one package, and verify the Queue until every selected target reports success.

          # Part VI — Troubleshooting matrix

          | Symptom | Most likely cause | Safe action |
          |---|---|---|
          | Ollama is not found | Service is not running or no model is installed | Start Ollama, run `ollama list`, then click **Знайти моделі** again |
          | Rewrite hangs on first use | Model cold start or model too large for the computer | Wait for preload, choose a smaller model, keep the application open |
          | English or Russian rewrite is rejected | Language/grounding gate worked as designed | Re-run with the same sources or improve the merged source block; do not disable the gate |
          | Facebook pages are missing | Wrong token, missing page role, expired token, or pagination/API failure | Create a valid User Access Token, confirm roles, then click **Знайти сторінки** |
          | Threads publishing works but trend search does not | `threads_keyword_search` is absent | Continue publishing; add the optional permission only when trend search is required |
          | LinkedIn token check fails | Missing `w_member_social`, expired token, or wrong account | Generate a new token with all required scopes |
          | Telegram bot is valid but cannot post | Bot lacks channel administrator status or `can_post_messages` | Promote the bot and grant posting permission |
          | Google Drive connects but media check fails | Wrong file link, unsupported media, no delete permission, or OAuth mismatch | Use the direct file link and reconnect the correct Google account |
          | Connection status is temporarily unverified | DNS, network, or platform outage | Do not rotate tokens without explicit invalid-token evidence; retry later |
          | Queue package is paused | Automatic retry limit or authentication block was reached | Correct the platform issue, then use **Повторити невідправлені** |
          | Package is overdue | Application was closed or unavailable at scheduled time | Use **Перепланувати пропущені / призупинені** |
          | Settings appear lost after moving | Only part of the folder was copied, or key/config pair was separated | Restore the complete previous folder from backup |
          | Second application window will not start | OS instance lock is protecting the database and queue | Close the running instance normally; do not remove lock files while it is active |

          # Part VII — First live publication checklist

          - [ ] The complete portable folder has been backed up.
          - [ ] Ollama and the selected model are available.
          - [ ] Every intended source has been tested.
          - [ ] The news block contains all relevant source texts.
          - [ ] The final Ukrainian publication is factual and no longer than 900 characters.
          - [ ] The selected media belongs to the connected Drive account and contains no sensitive data.
          - [ ] Only intended platform targets are selected.
          - [ ] The scheduled time is correct for Kyiv time.
          - [ ] All connection diagnostics are current.
          - [ ] After publication, every target status and remote ID has been reviewed.
          - [ ] The Drive file was deleted only after all selected targets succeeded.

          # Part VIII — Credential inventory template

          Record identifiers and expiry dates, but never write secret values into this document or commit them to GitHub.

          | Integration | Account/application identifier | Required scopes or role | Expiry/review date | Status |
          |---|---|---|---|---|
          | Meta application |  | App ID / App Secret stored only in the encrypted application config |  |  |
          | Facebook User Token |  | Page access and required Graph permissions |  |  |
          | Threads |  | `threads_basic`, `threads_content_publish`; optional `threads_keyword_search` |  |  |
          | LinkedIn |  | `openid`, `profile`, `w_member_social` |  |  |
          | Telegram |  | Channel administrator, `can_post_messages` |  |  |
          | Google Drive |  | Desktop OAuth client, Drive API enabled |  |  |

          # Part IX — Recovery rule

          When something fails, preserve evidence and protect data before changing anything: close the application, copy the complete portable folder, sanitize logs, note the exact target statuses and remote IDs, and change only the component proven to be faulty. Never erase the queue or replace the `Data` directory merely because one platform returned an error.
          EOF

          git show "$UA_SOURCE_REF:README_UA.md" > "$BUILD/ua-readme.md"
          git show "$UA_SOURCE_REF:PLATFORM_SETUP_UA.md" > "$BUILD/ua-platform.md"
          git show "$UA_SOURCE_REF:PORTABLE_MODE_UA.md" > "$BUILD/ua-portable.md"
          sed -i 's/FIX23/R8 FIX30/g; s/FIX28/R8 FIX30/g' "$BUILD/ua-platform.md"

          cat > "$BUILD/manual-ua.md" <<'EOF'
          ---
          title: "UA FREE Content Tool"
          subtitle: "Повний посібник зі встановлення, налаштування, роботи, резервного копіювання та усунення несправностей"
          author: "UA FREE"
          date: "Версія 1.0.0 / перевірена збірка R8 FIX30"
          lang: uk-UA
          ---

          ```{=openxml}
          <w:p><w:r><w:br w:type="page"/></w:r></w:p>
          ```

          # Призначення і межі посібника

          Це повний практичний посібник зі встановлення, налаштування, перевірки, щоденної роботи, резервного копіювання, перенесення та відновлення UA FREE Content Tool у Windows 10 або Windows 11. Він розрахований на редактора або адміністратора без обов’язкової технічної підготовки.

          > **Критичне правило збереження даних:** робочим станом є вся портативна папка програми, насамперед каталог `Data`. Не оновлюйте, не переносьте і не копіюйте лише EXE. Не розділяйте `Data/config.portable` і `Data/portable.key`.

          ## Рекомендована послідовність налаштування

          1. Завантажити Windows portable ZIP і `SHA256SUMS.txt` з останнього GitHub Release.
          2. Перевірити SHA-256 до розпакування.
          3. Повністю розпакувати програму в постійну папку з правом запису.
          4. Встановити й запустити Ollama, завантажити локальну модель.
          5. Запустити `UA_FREE_Content_Tool.exe` без прав адміністратора.
          6. У вкладці **Налаштування** вибрати модель Ollama і зберегти зміни.
          7. Налаштувати лише ті соціальні платформи, у які реально планується публікація.
          8. Підключити Google Drive, якщо потрібні фото або відео.
          9. Додати й перевірити джерела.
          10. Натиснути **Перевірити всі підключення зараз**.
          11. Створити повну резервну копію папки програми.
          12. Виконати одну контрольовану живу публікацію й перевірити результат кожної платформи.

          ## Що підготувати заздалегідь

          | Компонент | Що потрібно |
          |---|---|
          | Windows | Windows 10/11 і право запису в обрану папку |
          | Ollama | Установлена служба Ollama та щонайменше одна локальна текстова модель |
          | Facebook Pages | Meta App ID, App Secret, чинний Facebook User Access Token і роль на сторінці |
          | Threads | Threads access token із потрібними дозволами |
          | LinkedIn | Токен із `openid`, `profile`, `w_member_social` |
          | Telegram | Bot Token, username або ID каналу, статус адміністратора, `can_post_messages` |
          | Google Drive | Google Cloud OAuth Client ID типу Desktop app і, якщо видано, Client Secret |
          | Джерела | RSS URL, URL сайту або ідентифікатор публічного Telegram-каналу |

          # Частина I — Огляд продукту і повний робочий процес
          EOF
          tail -n +2 "$BUILD/ua-readme.md" >> "$BUILD/manual-ua.md"

          cat >> "$BUILD/manual-ua.md" <<'EOF'

          # Частина II — Налаштування платформ і Google Drive
          EOF
          tail -n +2 "$BUILD/ua-platform.md" >> "$BUILD/manual-ua.md"

          cat >> "$BUILD/manual-ua.md" <<'EOF'

          # Частина III — Портативні дані, міграція, резервні копії та перенесення
          EOF
          tail -n +2 "$BUILD/ua-portable.md" >> "$BUILD/manual-ua.md"

          cat >> "$BUILD/manual-ua.md" <<'EOF'

          # Частина IV — Безпека та операційні межі

          ## Ніколи не публікуйте робочі дані

          Не додавайте до GitHub, Issue, листів або загальнодоступних сховищ реальну папку `Data`, `config.portable`, `portable.key`, SQLite-базу, WAL/SHM, access token, App Secret, OAuth Client Secret, refresh token, приватні Drive-посилання, журнали чи скриншоти із секретами та персональними даними.

          ## Як зберігаються секрети

          Портативна конфігурація шифрується AES-GCM. Ключ зберігається поруч із зашифрованою конфігурацією, щоб уся папка могла переноситися між комп’ютерами. Саме тому фізичний доступ до повної робочої папки потенційно дає доступ до облікових даних. Токени не зберігаються у SQLite, а секретні значення маскуються в інтерфейсі та штатних помилках.

          ## Мережеві й медійні обмеження

          Зовнішні URL проходять перевірки безпеки; приватні та non-global адреси відхиляються. Google Drive використовується через OAuth. Тимчасовий публічний доступ створюється лише до конкретного файла, коли цього потребує Threads. Програма відкликає тільки створений нею дозвіл і видаляє Drive-файл лише після успіху всіх вибраних платформ.

          ## Безпека черги

          SQLite працює з WAL, foreign keys і `synchronous=FULL`. Платформи обробляються послідовно. Частковий повтор не дублює успішні цілі. Другий одночасний процес блокується системним lock. Міграції перевіряють збереження pending-пакетів, статусів платформ, спроб і remote ID.

          # Частина V — Детальна процедура першого запуску

          ## 1. Перевірка завантаженого релізу

          Збережіть portable ZIP і `SHA256SUMS.txt` в одній тимчасовій папці. У PowerShell виконайте:

          ```powershell
          Get-FileHash .\UA_FREE_Content_Tool_v1.0.0_Windows_Portable.zip -Algorithm SHA256
          Get-Content .\SHA256SUMS.txt
          ```

          Порівняйте всі 64 символи хешу. За будь-якої відмінності файл не використовуйте.

          ## 2. Вибір постійної папки

          Рекомендовані варіанти: `C:\Tools\UA_FREE_Content_Tool` або окрема папка у профілі поточного користувача Windows. Не запускайте EXE безпосередньо з ZIP, із вікна попереднього перегляду браузера, з read-only каталогу або з папки, яку агресивно синхронізує хмарний клієнт під час роботи SQLite.

          ## 3. Перевірка портативної структури

          У розпакованій папці мають бути `UA_FREE_Content_Tool.exe`, `portable.flag`, документація та доступний для запису каталог `Data`, який використовується поруч із EXE. Під час перенесення копіюйте цю папку тільки як єдине ціле.

          ## 4. Налаштування Ollama

          Запустіть Ollama до відкриття програми. Команда `ollama list` має показати щонайменше одну модель. У **Налаштування → 1. Ollama і моделі** натисніть **Знайти моделі**, виберіть основну модель, за потреби іншу запасну модель і натисніть **ЗБЕРЕГТИ ЗМІНИ**.

          Програма очікує локальну адресу на кшталт `http://127.0.0.1:11434`. Віддалені або не-loopback адреси Ollama навмисно заборонені безпековими межами.

          ## 5. Налаштування платформ

          Підключайте платформи по одній. Введіть значення, виконайте платформну перевірку, прочитайте статус і збережіть зміни. Неналаштована платформа просто не буде доступною як ціль і не блокує решту програми.

          ## 6. Додавання джерел

          Відкрийте **Джерела**. Виберіть `rss`, `telegram` або `url`, введіть зрозумілу назву й адресу, натисніть **Додати**. Спочатку використовуйте невеликий набір. Увімкнені джерела перевіряються після запуску й кожні п’ять хвилин.

          ## 7. Наскрізна перевірка

          Запустіть діагностику всіх підключень, зберіть невелику вибірку новин, вручну об’єднайте пов’язані матеріали, створіть локальний рерайт, за потреби додайте несекретне тестове зображення, заплануйте один пакет і контролюйте **Чергу**, доки всі вибрані цілі не отримають успішний статус.

          # Частина VI — Матриця усунення несправностей

          | Симптом | Найімовірніша причина | Безпечна дія |
          |---|---|---|
          | Ollama не знайдено | Службу не запущено або немає моделі | Запустіть Ollama, виконайте `ollama list`, повторіть **Знайти моделі** |
          | Перший рерайт довго не завершується | Холодний старт або завелика модель | Дочекайтеся підготовки, виберіть меншу модель, не закривайте програму |
          | Англомовний або російськомовний рерайт відхилено | Спрацював мовний і фактологічний gate | Повторіть рерайт або покращте склад джерел; не вимикайте перевірку |
          | Facebook-сторінки не знайдено | Неправильний/прострочений токен, немає ролі або дозволів | Створіть чинний User Access Token, перевірте ролі, повторіть **Знайти сторінки** |
          | Threads публікує, але пошук трендів не працює | Немає `threads_keyword_search` | Публікація може тривати; додайте опційний дозвіл лише за потреби |
          | LinkedIn не приймає токен | Немає `w_member_social`, токен прострочено або інший акаунт | Створіть новий токен з усіма потрібними scopes |
          | Telegram-бот чинний, але не постить | Бот не адміністратор або немає `can_post_messages` | Додайте бота в адміністратори й дозвольте публікацію |
          | Drive підключено, але медіа не проходить | Невірне посилання, тип файла, права видалення або OAuth-акаунт | Використайте пряме посилання на файл і перепідключіть правильний акаунт |
          | Статус «тимчасово не перевірено» | DNS, мережа або збій платформи | Не міняйте токен без прямої ознаки invalid/expired; повторіть пізніше |
          | Пакет у черзі призупинено | Вичерпано автоматичні спроби або спрацював auth-block | Усуньте причину й натисніть **Повторити невідправлені** |
          | Пакет прострочено | Програму було закрито у запланований час | Натисніть **Перепланувати пропущені / призупинені** |
          | Після перенесення зникли налаштування | Скопійовано не всю папку або розділено ключ і конфігурацію | Відновіть повну попередню папку з резервної копії |
          | Друге вікно не запускається | Системний instance lock захищає базу і чергу | Нормально закрийте чинний процес; не видаляйте lock під час його роботи |

          # Частина VII — Чекліст першої живої публікації

          - [ ] Створено резервну копію всієї портативної папки.
          - [ ] Ollama та вибрана модель доступні.
          - [ ] Кожне потрібне джерело перевірено.
          - [ ] Блок містить усі релевантні тексти джерел.
          - [ ] Фінальний український текст фактологічний і не перевищує 900 символів.
          - [ ] Медіа належить підключеному Drive-акаунту й не містить чутливих даних.
          - [ ] Позначено лише потрібні платформи.
          - [ ] Час публікації правильно вказано за Києвом.
          - [ ] Діагностика всіх підключень актуальна.
          - [ ] Після публікації перевірено статус і remote ID кожної платформи.
          - [ ] Drive-файл видалено лише після успіху всіх цілей.

          # Частина VIII — Шаблон обліку інтеграцій

          Записуйте ідентифікатори й строки, але ніколи не вносьте секретні значення в цей документ і не комітьте їх у GitHub.

          | Інтеграція | Ідентифікатор акаунта/застосунку | Потрібні дозволи або роль | Дата перегляду/закінчення | Статус |
          |---|---|---|---|---|
          | Meta application |  | App ID / App Secret тільки у зашифрованій конфігурації |  |  |
          | Facebook User Token |  | Доступ до сторінок і потрібні Graph permissions |  |  |
          | Threads |  | `threads_basic`, `threads_content_publish`; опційно `threads_keyword_search` |  |  |
          | LinkedIn |  | `openid`, `profile`, `w_member_social` |  |  |
          | Telegram |  | Адміністратор каналу, `can_post_messages` |  |  |
          | Google Drive |  | Desktop OAuth client, увімкнений Drive API |  |  |

          # Частина IX — Правило відновлення

          Коли щось не працює, спочатку збережіть докази й захистіть дані: закрийте програму, скопіюйте всю портативну папку, санітизуйте журнали, зафіксуйте точні статуси платформ і remote ID, а потім змінюйте тільки компонент, несправність якого доведена. Не очищайте чергу і не замінюйте `Data` лише через помилку однієї платформи.
          EOF

          wc -w "$BUILD/manual-en.md" "$BUILD/manual-ua.md"

      - name: Convert source manuals to styled DOCX
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/ua-free-manuals"
          pandoc "$BUILD/manual-en.md" \
            --from=gfm+raw_attribute \
            --to=docx \
            --reference-doc="$BUILD/reference.docx" \
            --toc --toc-depth=3 --number-sections \
            --output="$BUILD/UA_FREE_Content_Tool_Complete_Setup_Manual_EN.docx"
          pandoc "$BUILD/manual-ua.md" \
            --from=gfm+raw_attribute \
            --to=docx \
            --reference-doc="$BUILD/reference.docx" \
            --toc --toc-depth=3 --number-sections \
            --output="$BUILD/UA_FREE_Content_Tool_Complete_Setup_Manual_UA.docx"
          test -s "$BUILD/UA_FREE_Content_Tool_Complete_Setup_Manual_EN.docx"
          test -s "$BUILD/UA_FREE_Content_Tool_Complete_Setup_Manual_UA.docx"

      - name: Convert manuals to PDF and validate
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/ua-free-manuals"
          mkdir -p docs/manuals
          rm -f docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_EN.pdf
          rm -f docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_UA.pdf
          libreoffice --headless --convert-to pdf --outdir docs/manuals "$BUILD"/*.docx
          test -s docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_EN.pdf
          test -s docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_UA.pdf
          EN_PAGES="$(pdfinfo docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_EN.pdf | awk '/^Pages:/ {print $2}')"
          UA_PAGES="$(pdfinfo docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_UA.pdf | awk '/^Pages:/ {print $2}')"
          test "$EN_PAGES" -ge 12
          test "$UA_PAGES" -ge 12
          echo "English manual pages: $EN_PAGES"
          echo "Ukrainian manual pages: $UA_PAGES"
          sha256sum docs/manuals/*.pdf

      - name: Add manual links to the main README
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          start = "<!-- SETUP_MANUALS_START -->"
          end = "<!-- SETUP_MANUALS_END -->"
          block = """<!-- SETUP_MANUALS_START -->
          ## Complete setup manuals

          - [English: complete installation and configuration manual (PDF)](docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_EN.pdf)
          - [Українською: повний посібник зі встановлення та налаштування (PDF)](docs/manuals/UA_FREE_Content_Tool_Complete_Setup_Manual_UA.pdf)

          The manuals cover portable installation, checksum verification, Ollama, Facebook Pages, Threads, LinkedIn, Telegram, Google Drive media, source collection, editorial workflow, scheduling, queue recovery, backups, migration, security, first-live-publication checklists, and troubleshooting.
          <!-- SETUP_MANUALS_END -->"""

          if start in text and end in text:
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              text = before.rstrip() + "\n\n" + block + "\n\n" + after.lstrip()
          else:
              marker = "## Bug and vulnerability reports"
              if marker not in text:
                  marker = "## License"
              if marker in text:
                  text = text.replace(marker, block + "\n\n" + marker, 1)
              else:
                  text = text.rstrip() + "\n\n" + block + "\n"
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Refresh repository manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import hashlib

          root = Path.cwd()
          lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == "FILE_MANIFEST.sha256":
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")

          (root / "FILE_MANIFEST.sha256").write_text(
              "\n".join(lines) + "\n",
              encoding="ascii",
              newline="\n",
          )
          '@ | python -

      - name: Commit generated manuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md FILE_MANIFEST.sha256 docs/manuals/*.pdf
          if git diff --cached --quiet; then
            echo "Manual PDFs are already current."
            exit 0
          fi
          git commit -m "Add complete bilingual setup manuals"
          git push origin HEAD:main
