name: Trigger validated source deployment

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.title == '__DEPLOY_COMPLETE_UA_FREE_CONTENT_TOOL_V1_0_0__'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repository}/actions/workflows/deploy-source.yml/dispatches'
          body = json.dumps({'ref': 'main'}).encode('utf-8')
          request = urllib.request.Request(
              url,
              data=body,
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ua-free-content-tool-deploy-trigger',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(f'Unexpected dispatch status: {response.status}')
          print('DEPLOYMENT_WORKFLOW_DISPATCHED=true')
          PY
