name: Deploy exact v1.0.0 repository package

on:
  workflow_dispatch:
  push:
    paths:
      - UA_FREE_Content_Tool_v1.0.0_GitHub_Repository_Package.zip

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-exact-v1.0.0-package
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: UA_FREE_Content_Tool_v1.0.0_GitHub_Repository_Package.zip
      EXPECTED_SHA256: a18f8833fa8c586974537d38d0484e922e42da9b95c001c6c8240df368f8e825
      EXPECTED_SIZE: '294609'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact ZIP and prepare clean repository tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import re
          import shutil
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          package = workspace / os.environ['PACKAGE_NAME']
          expected_size = int(os.environ['EXPECTED_SIZE'])
          expected_sha = os.environ['EXPECTED_SHA256']

          if not package.is_file():
              raise SystemExit(
                  f'Missing {package.name}. Upload the exact repository ZIP to the root of main.'
              )

          payload = package.read_bytes()
          actual_size = len(payload)
          actual_sha = hashlib.sha256(payload).hexdigest()
          print(f'PACKAGE_SIZE={actual_size}')
          print(f'PACKAGE_SHA256={actual_sha}')
          if actual_size != expected_size:
              raise SystemExit(f'Package size mismatch: {actual_size} != {expected_size}')
          if actual_sha != expected_sha:
              raise SystemExit(f'Package SHA-256 mismatch: {actual_sha} != {expected_sha}')

          current_readme = (workspace / 'README.md').read_text(encoding='utf-8')
          final_readme = re.sub(
              r'<!-- DEPLOYMENT_WARNING_START -->.*?<!-- DEPLOYMENT_WARNING_END -->\s*',
              '',
              current_readme,
              flags=re.DOTALL,
          ).strip() + '\n'

          staging = Path(tempfile.mkdtemp(prefix='ua-free-content-tool-', dir=os.environ['RUNNER_TEMP']))
          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'ZIP CRC failed: {bad}')

              infos = archive.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate ZIP member names detected')

              roots = {name.split('/', 1)[0] for name in names if name}
              if roots != {'ua-free-content-tool'}:
                  raise SystemExit(f'Unexpected canonical root: {sorted(roots)}')

              file_count = 0
              for info in infos:
                  name = info.filename
                  pure = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if name.startswith(('/', '\\')) or '\\' in name or '..' in pure.parts:
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Symlink is not allowed: {name}')
                  if not info.is_dir():
                      file_count += 1

              if file_count != 123:
                  raise SystemExit(f'Unexpected file count: {file_count} != 123')

              archive.extractall(staging)

          source = staging / 'ua-free-content-tool'
          required = {
              'content_agent/main.py',
              'content_agent/ui/main_window.py',
              'tests/test_r8_fix30.py',
              'requirements.txt',
              'FILE_MANIFEST.sha256',
              'README.md',
              '.github/workflows/release.yml',
          }
          missing = sorted(path for path in required if not (source / path).is_file())
          if missing:
              raise SystemExit(f'Required files missing from package: {missing}')

          forbidden = []
          for path in source.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(source)
              parts = relative.parts
              lower_name = relative.name.lower()
              if parts and parts[0] == 'Data':
                  forbidden.append(relative.as_posix())
              if '__pycache__' in parts or '.pytest_cache' in parts:
                  forbidden.append(relative.as_posix())
              if lower_name in {'.env', 'config.portable', 'portable.key', 'instance.lock'}:
                  forbidden.append(relative.as_posix())
              if lower_name.endswith(('.db', '.sqlite', '.sqlite3', '.sqlite3-wal', '.sqlite3-shm', '.log', '.pyc', '.pem', '.p12', '.pfx')):
                  forbidden.append(relative.as_posix())
          if forbidden:
              raise SystemExit('Forbidden runtime or secret files: ' + ', '.join(sorted(set(forbidden))))

          # Replace the temporary repository tree completely, but never touch .git.
          for child in workspace.iterdir():
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in source.iterdir():
              destination = workspace / child.name
              if child.is_dir():
                  shutil.copytree(child, destination)
              else:
                  shutil.copy2(child, destination)

          # Keep the detailed Ukrainian repository overview already prepared in main.
          (workspace / 'README.md').write_text(final_readme, encoding='utf-8', newline='\n')
          (workspace / 'README_UA.md').write_text(final_readme, encoding='utf-8', newline='\n')

          # Rebuild manifest after the README replacement.
          manifest = []
          for path in sorted(workspace.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              relative = path.relative_to(workspace).as_posix()
              if relative == 'FILE_MANIFEST.sha256':
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest.append(f'{digest}  {relative}')
          (workspace / 'FILE_MANIFEST.sha256').write_text(
              '\n'.join(manifest) + '\n', encoding='ascii', newline='\n'
          )

          final_files = [p for p in workspace.rglob('*') if p.is_file() and '.git' not in p.parts]
          if len(final_files) != 123:
              raise SystemExit(f'Final repository file count mismatch: {len(final_files)} != 123')
          print(f'FINAL_FILES={len(final_files)}')
          PY

      - name: Commit clean full source tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Deploy complete UA FREE Content Tool v1.0.0 source"
          git push origin HEAD:main

      - name: Start Windows release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version=1.0.0 -f prerelease=false
          echo "Release workflow dispatched."
