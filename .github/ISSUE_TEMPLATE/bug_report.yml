name: Bug report
description: Report a reproducible problem in UA FREE Content Tool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove tokens, secrets, private Drive links and personal data before submitting.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: v1.0.0 / R8 FIX30
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Ollama model
      placeholder: qwen3:4b
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      description: Do not include credentials or private links.
